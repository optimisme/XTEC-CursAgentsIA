<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slider Puzzle</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #ecf0f1;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 20px;
        }
        #puzzle {
            position: relative;
            width: 320px;
            height: 320px;
            background-color: #bdc3c7;
            padding: 10px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            box-sizing: border-box;
        }
        .tile {
            position: absolute;
            width: 100px;
            height: 100px;
            background-color: #3498db;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            user-select: none;
            transition: transform 0.2s ease-in-out;
        }
        .tile:hover {
            background-color: #2980b9;
        }
        #message {
            margin-top: 20px;
            height: 2rem;
            font-size: 1.5rem;
            font-weight: bold;
            color: #27ae60;
        }
        button {
            margin-top: 20px;
            padding: 10px 25px;
            font-size: 1rem;
            font-weight: bold;
            color: white;
            background-color: #e67e22;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #d35400;
        }
    </style>
</head>
<body>
    <h1>Slider Puzzle</h1>
    <div id="puzzle"></div>
    <div id="message"></div>
    <button onclick="initGame()">New Game</button>

    <script>
        let tiles = [1, 2, 3, 4, 5, 6, 7, 8, null];
        const puzzleElement = document.getElementById('puzzle');
        const messageElement = document.getElementById('message');
        let pieceElements = {};

        function initGame() {
            tiles = [1, 2, 3, 4, 5, 6, 7, 8, null];
            shuffle(tiles);
            setupPuzzleDOM();
            render();
            messageElement.textContent = '';
        }

        function shuffle(array) {
            for (let i = 0; i < 200; i++) {
                const emptyIndex = array.indexOf(null);
                const neighbors = getNeighbors(emptyIndex);
                const randomNeighbor = neighbors[Math.floor(Math.random() * neighbors.length)];
                [array[emptyIndex], array[randomNeighbor]] = [array[randomNeighbor], array[emptyIndex]];
            }
        }

        function getNeighbors(idx) {
            const res = [];
            const r = Math.floor(idx / 3);
            const c = idx % 3;
            if (r > 0) res.push(idx - 3);
            if (r < 2) res.push(idx + 3);
            if (c > 0) res.push(idx - 1);
            if (c < 2) res.push(idx + 1);
            return res;
        }

        function setupPuzzleDOM() {
            puzzleElement.innerHTML = '';
            pieceElements = {};
            for (let i = 1; i <= 8; i++) {
                const div = document.createElement('div');
                div.className = 'tile';
                div.textContent = i;
                div.onclick = () => moveTile(i);
                puzzleElement.appendChild(div);
                pieceElements[i] = div;
            }
        }

        function render() {
            for (let i = 0; i < 9; i++) {
                const val = tiles[i];
                if (val !== null) {
                    const el = pieceElements[val];
                    const row = Math.floor(i / 3);
                    const col = i % 3;
                    const x = col * 110 + 10;
                    const y = row * 110 + 10;
                    el.style.transform = `translate(${x}px, ${y}px)`;
                }
            }
        }

        function moveTile(val) {
            const tileIndex = tiles.indexOf(val);
            const emptyIndex = tiles.indexOf(null);
            const neighbors = getNeighbors(tileIndex);
            if (neighbors.includes(emptyIndex)) {
                [tiles[tileIndex], tiles[emptyIndex]] = [tiles[emptyIndex], tiles[tileIndex]];
                render();
                checkWin();
            }
        }

        function checkWin() {
            const winningState = [1, 2, 3, 4, 5, 6, 7, 8, null];
            const isWin = tiles.every((val, index) => val === winningState[index]);
            if (isWin) {
                messageElement.textContent = 'You won! 🎉';
            }
        }

        initGame();
    </script>
</body>
</html>
