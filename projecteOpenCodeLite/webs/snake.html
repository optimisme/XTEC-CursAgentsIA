<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <style>
        :root {
            --bg-color: #1a1a2e;
            --canvas-bg: #16213e;
            --snake-color: #4ecca3;
            --food-color: #e94560;
            --text-color: #eeeeee;
            --accent-color: #0f3460;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: var(--text-color);
            overflow: hidden;
        }

        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            padding: 20px;
            background: var(--accent-color);
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .header {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 400px;
            align-items: center;
        }

        .score-box {
            font-size: 1.5rem;
            font-weight: bold;
        }

        canvas {
            background-color: var(--canvas-bg);
            border: 4px solid #0f3460;
            border-radius: 8px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
            max-width: 100%;
            height: auto;
        }

        .controls {
            display: flex;
            gap: 10px;
        }

        button {
            padding: 10px 20px;
            font-size: 1rem;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            background-color: var(--snake-color);
            color: var(--bg-color);
            font-weight: bold;
            transition: transform 0.1s, opacity 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }

        button:active {
            transform: translateY(0);
        }

        .msg-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.8);
            padding: 20px 40px;
            border-radius: 10px;
            text-align: center;
            pointer-events: none;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <div class="header">
            <h1 style="margin:0; font-size: 1.5rem;">Snake JS</h1>
            <div class="score-box">Score: <span id="score">0</span></div>
        </div>
        
        <div style="position: relative;">
            <canvas id="gameCanvas" width="400" height="400"></canvas>
            <div id="overlay" class="msg-overlay">Press an Arrow Key to Start</div>
        </div>

        <div class="controls">
            <button id="btnPause">Pause</button>
            <button id="btnRestart">Restart</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const overlay = document.getElementById('overlay');
        const btnPause = document.getElementById('btnPause');
        const btnRestart = document.getElementById('btnRestart');

        // Game Constants
        const GRID_SIZE = 20;
        const TILE_COUNT = canvas.width / GRID_SIZE;
        const INITIAL_SPEED = 100; // ms

        // Game Variables
        let snake = [];
        let food = { x: 0, y: 0 };
        let dx = 0;
        let dy = 0;
        let nextDx = 0;
        let nextDy = 0;
        let score = 0;
        let gameRunning = false;
        let isPaused = false;
        let lastTime = 0;
        let gameSpeed = INITIAL_SPEED;

        function initGame() {
            snake = [
                { x: 10 * GRID_SIZE, y: 10 * GRID_SIZE },
                { x: 9 * GRID_SIZE, y: 10 * GRID_SIZE },
                { x: 8 * GRID_SIZE, y: 10 * GRID_SIZE }
            ];
            dx = GRID_SIZE;
            dy = 0;
            nextDx = GRID_SIZE;
            nextDy = 0;
            score = 0;
            scoreEl.innerText = score;
            gameRunning = false;
            isPaused = false;
            overlay.innerText = "Press an Arrow Key to Start";
            overlay.classList.remove('hidden');
            spawnFood();
            draw();
        }

        function spawnFood() {
            food.x = Math.floor(Math.random() * TILE_COUNT) * GRID_SIZE;
            food.y = Math.floor(Math.random() * TILE_COUNT) * GRID_SIZE;
            
            // Ensure food doesn't spawn on snake
            let onSnake = false;
            for (let part of snake) {
                if (part.x === food.x && part.y === food.y) {
                    onSnake = true;
                    break;
                }
            }
            if (onSnake) spawnFood();
        }

        function draw() {
            // Clear canvas
            ctx.fillStyle = '#16213e';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw Food
            ctx.fillStyle = '#e94560';
            ctx.fillRect(food.x, food.y, GRID_SIZE - 2, GRID_SIZE - 2);

            // Draw Snake
            snake.forEach((part, index) => {
                ctx.fillStyle = index === 0 ? '#4ecca3' : '#45a282';
                ctx.fillRect(part.x, part.y, GRID_SIZE - 2, GRID_SIZE - 2);
            });
        }

        function update() {
            if (!gameRunning || isPaused) return;

            dx = nextDx;
            dy = nextDy;

            const head = { x: snake[0].x + dx, y: snake[0].y + dy };

            // Collision Detection: Walls
            if (head.x < 0 || head.x >= canvas.width || head.y < 0 || head.y >= canvas.height) {
                gameOver();
                return;
            }

            // Collision Detection: Self
            for (let i = 0; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    gameOver();
                    return;
                }
            }

            snake.unshift(head);

            // Food Consumption
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreEl.innerText = score;
                spawnFood();
                // Speed up slightly
                if (gameSpeed > 40) gameSpeed -= 1;
            } else {
                snake.pop();
            }

            draw();
        }

        function gameOver() {
            gameRunning = false;
            overlay.innerText = "GAME OVER\nPress Restart";
            overlay.classList.remove('hidden');
        }

        function gameLoop(timestamp) {
            if (!lastTime) lastTime = timestamp;
            const delta = timestamp - lastTime;

            if (delta > gameSpeed) {
                update();
                lastTime = timestamp;
            }

            requestAnimationFrame(gameLoop);
        }

        // Input Handling
        window.addEventListener('keydown', (e) => {
            switch (e.key) {
                case 'ArrowUp':
                    if (dy !== GRID_SIZE) { nextDx = 0; nextDy = -GRID_SIZE; }
                    break;
                case 'ArrowDown':
                    if (dy !== -GRID_SIZE) { nextDx = 0; nextDy = GRID_SIZE; }
                    break;
                case 'ArrowLeft':
                    if (dx !== GRID_SIZE) { nextDx = -GRID_SIZE; nextDy = 0; }
                    break;
                case 'ArrowRight':
                    if (dx !== -GRID_SIZE) { nextDx = GRID_SIZE; nextDy = 0; }
                    break;
            }

            if (!gameRunning && overlay.innerText.includes("Start")) {
                gameRunning = true;
                overlay.classList.add('hidden');
            }
        });

        btnPause.addEventListener('click', () => {
            if (!gameRunning) return;
            isPaused = !isPaused;
            btnPause.innerText = isPaused ? "Resume" : "Pause";
            overlay.innerText = isPaused ? "Paused" : "";
            overlay.classList.toggle('hidden', !isPaused);
        });

        btnRestart.addEventListener('click', () => {
            initGame();
            btnPause.innerText = "Pause";
        });

        // Start
        initGame();
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
