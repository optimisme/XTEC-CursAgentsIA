<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <style>
        body {
            background-color: #2c3e50;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #game-container {
            text-align: center;
            background-color: #34495e;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        canvas {
            border: 4px solid #ecf0f1;
            background-color: #000;
            image-rendering: pixelated;
            max-width: 100%;
            height: auto;
        }
        h1 { margin-top: 0; }
        .score-board {
            font-size: 24px;
            margin-bottom: 10px;
        }
        .controls {
            margin-top: 15px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background-color: #e67e22;
            border: none;
            color: white;
            border-radius: 5px;
            margin: 0 5px;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #d35400;
        }
        button:active {
            transform: translateY(2px);
        }
        .message {
            height: 20px;
            margin-bottom: 10px;
            color: #f1c40f;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <h1 style="font-size: 2rem;">Snake Game</h1>
        <div class="score-board">Score: <span id="score">0</span></div>
        <div id="message" class="message">Press an arrow key to start</div>
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        <div class="controls">
            <button id="pauseBtn">Pause</button>
            <button id="restartBtn">Restart</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const messageElement = document.getElementById('message');
        const pauseBtn = document.getElementById('pauseBtn');
        const restartBtn = document.getElementById('restartBtn');

        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        let score = 0;
        let dx = 0;
        let dy = 0;
        let snake = [{x: 10, y: 10}];
        let food = {x: 15, y: 15};
        let nextDx = 0;
        let nextDy = 0;
        let gamePaused = false;
        let gameStarted = false;
        let gameOver = false;

        let lastUpdateTime = 0;
        const gameSpeed = 100; // ms per frame

        function main(currentTime) {
            if (gameOver || gamePaused) {
                requestAnimationFrame(main);
                return;
            }

            if (!gameStarted) {
                requestAnimationFrame(main);
                return;
            }

            if (currentTime - lastUpdateTime > gameSpeed) {
                clearCanvas();
                moveSnake();
                drawGame();
                lastUpdateTime = currentTime;
            }
            requestAnimationFrame(main);
        }

        function clearCanvas() {
            ctx.fillStyle = 'black';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function drawGame() {
            // Draw food
            ctx.fillStyle = '#e74c3c';
            ctx.beginPath();
            ctx.arc(food.x * gridSize + gridSize / 2, food.y * gridSize + gridSize / 2, (gridSize - 2) / 2, 0, Math.PI * 2);
            ctx.fill();

            // Draw snake
            snake.forEach((part, index) => {
                ctx.fillStyle = (index === 0) ? '#27ae60' : '#2ecc71';
                ctx.fillRect(part.x * gridSize, part.y * gridSize, gridSize - 2, gridSize - 2);
            });
        }

        function moveSnake() {
            dx = nextDx;
            dy = nextDy;

            const head = { x: snake[0].x + dx, y: snake[0].y + dy };

            // Check wall collisions
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                gameOver = true;
                messageElement.innerText = "Game Over!";
                return;
            }

            // Check self collisions
            for (let i = 0; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    gameOver = true;
                    messageElement.innerText = "Game Over!";
                    return;
                }
            }

            snake.unshift(head);

            // Check food collision
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreElement.innerText = score;
                generateFood();
            } else {
                snake.pop();
            }
        }

        function generateFood() {
            food.x = Math.floor(Math.random() * tileCount);
            food.y = Math.floor(Math.random() * tileCount);
            snake.forEach(part => {
                if (part.x === food.x && part.y === food.y) {
                    generateFood();
                }
            });
        }

        document.addEventListener('keydown', (e) => {
            if (gameOver) return;

            if (!gameStarted) {
                gameStarted = true;
                messageElement.innerText = "";
            }

            switch (e.key) {
                case 'ArrowUp':
                    if (dy !== 1) { nextDx = 0; nextDy = -1; }
                    break;
                case 'ArrowDown':
                    if (dy !== -1) { nextDx = 0; nextDy = 1; }
                    break;
                case 'ArrowLeft':
                    if (dx !== 1) { nextDx = -1; nextDy = 0; }
                    break;
                case 'ArrowRight':
                    if (dx !== -1) { nextDx = 1; nextDy = 0; }
                    break;
                case ' ':
                    gamePaused = !gamePaused;
                    pauseBtn.innerText = gamePaused ? "Resume" : "Pause";
                    if (!gamePaused) {
                        messageElement.innerText = "";
                    }
                    break;
            }
        });

        pauseBtn.addEventListener('click', () => {
            gamePaused = !gamePaused;
            pauseBtn.innerText = gamePaused ? "Resume" : "Pause";
            if (!gamePaused) {
                messageElement.innerText = "";
            }
        });

        restartBtn.addEventListener('click', () => {
            score = 0;
            scoreElement.innerText = score;
            dx = 0;
            dy = 0;
            nextDx = 0;
            nextDy = 0;
            snake = [{x: 10, y: 10}];
            food = {x: 15, y: 15};
            gameOver = false;
            gameStarted = false;
            gamePaused = false;
            messageElement.innerText = "Press an arrow key to start";
            pauseBtn.innerText = "Pause";
            generateFood();
        });

        requestAnimationFrame(main);
    </script>
</body>
</html>
