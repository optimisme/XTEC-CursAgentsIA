<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swiss Station Clock</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f0f0f0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        canvas {
            background-color: #fff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            border-radius: 50%;
            border: 4px solid #333;
        }
    </style>
</head>
<body>
    <canvas id="clock" width="500" height="500"></canvas>

    <script>
        const canvas = document.getElementById('clock');
        const ctx = canvas.getContext('2d');
        const radius = canvas.width / 2;
        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;

        function drawClock() {
            const now = new Date();
            const ms = now.getMilliseconds();
            const seconds = now.getSeconds();
            const minutes = now.getMinutes();
            const hours = now.getHours();

            // Clear canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw face
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius - 10, 0, 2 * Math.PI);
            ctx.fillStyle = 'white';
            ctx.fill();
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 2;
            ctx.stroke();

            // Draw markers/numerals
            ctx.fillStyle = 'black';
            ctx.font = 'bold 24px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            for (let i = 1; i <= 12; i++) {
                const angle = (i * 30 - 90) * (Math.PI / 180);
                const x = centerX + (radius - 40) * Math.cos(angle);
                const y = centerY + (radius - 40) * Math.sin(angle);
                ctx.fillText(i, x, y);
            }

            // Draw hour hand
            const hourAngle = (hours % 12 + minutes / 60) * 30 * (Math.PI / 180);
            drawHand(hourAngle, radius * 0.5, 10, 'black');

            // Draw minute hand
            const minAngle = (minutes + seconds / 60) * 6 * (Math.PI / 180);
            drawHand(minAngle, radius * 0.8, 7, 'black');

            // Draw second hand
            const secAngle = (seconds + ms / 1000) * 6 * (Math.PI / 180);
            drawHand(secAngle, radius * 0.9, 3, 'red', true);

            // Center dot
            ctx.beginPath();
            ctx.arc(centerX, centerY, 5, 0, 2 * Math.PI);
            ctx.fillStyle = 'black';
            ctx.fill();

            requestAnimationFrame(drawClock);
        }

        function drawHand(angle, length, width, color, isBaton = false) {
            ctx.beginPath();
            ctx.lineWidth = width;
            ctx.lineCap = 'round';
            ctx.strokeStyle = color;
            
            const x = centerX + length * Math.cos(angle - Math.PI / 2);
            const y = centerY + length * Math.sin(angle - Math.PI / 2);

            if (isBaton) {
                // Baton shape for second hand
                ctx.moveTo(centerX, centerY);
                ctx.lineTo(x, y);
                ctx.stroke();
                // Small head of the baton
                ctx.lineWidth = width * 2;
                ctx.beginPath();
                ctx.arc(x, y, width * 1.5, 0, 2 * Math.PI);
                ctx.stroke();
                ctx.lineWidth = width;
            } else {
                ctx.moveTo(centerX, centerY);
                ctx.lineTo(x, y);
                ctx.stroke();
            }
        }

        // Start animation
        requestAnimationFrame(drawClock);
    </script>
</body>
</html>
