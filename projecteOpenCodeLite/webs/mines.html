<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minesweeper</title>
    <link rel="stylesheet" href="mines.css">
</head>
<body>
    <div class="window">
        <div class="title-bar">
            <span>Minesweeper</span>
            <span>_</span>
        </div>
        <div class="game-container">
            <div id="difficulty-selector" class="difficulty-selector">
                <button id="beginner">Beginner</button>
                <button id="intermediate">Intermediate</button>
                <button id="expert">Expert</button>
            </div>
            <div id="grid" class="grid"></div>
            <div class="status-bar">
                <div id="mine-count">Mines: 10</div>
                <button id="reset-btn">Reset</button>
            </div>
        </div>
    </div>

    <script src="mines.js"></script>
</body>
</html>
