# Stop:    docker compose -f compose-qwen3-vl-2b-instruct-cuda-vram8-vllm-qwen-fp8-64k-image.yml down
# Restart: docker compose -f compose-qwen3-vl-2b-instruct-cuda-vram8-vllm-qwen-fp8-64k-image.yml up -d
# Logs:    docker logs -f --tail 80 qwen3_vl_2b_instruct_cuda_vram8_vllm_qwen_fp8_image_64k
# Note:    Qwen3-VL 2B Instruct FP8 image-only vLLM profile. Remote service listens on port 8000.
name: qwen3-vl-2b-fp8-image-64k
services:
  qwen-vllm:
    image: vllm/vllm-openai:v0.23.0
    pull_policy: missing
    container_name: qwen3_vl_2b_instruct_cuda_vram8_vllm_qwen_fp8_image_64k
    environment:
      - HF_HOME=/root/.cache/huggingface
      - HUGGINGFACE_HUB_CACHE=/root/.cache/huggingface/hub
      - VLLM_CACHE_ROOT=/root/.cache/vllm
      - PYTORCH_ALLOC_CONF=expandable_segments:True
      - HF_HUB_DISABLE_XET=1
      - FLASHINFER_DISABLE_VERSION_CHECK=1
      - CUTE_DSL_ARCH=sm_121a
    volumes:
      - ./tokens.env:/run/secrets/tokens.env:ro
      - xtec-qwen3-vl-2b-instruct-cuda-vram8-vllm-qwen-fp8-64k-image-hf-cache:/root/.cache/huggingface
      - xtec-qwen3-vl-2b-instruct-cuda-vram8-vllm-qwen-fp8-64k-image-vllm-cache:/root/.cache/vllm
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/v1/models"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 20m
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    entrypoint:
      - /bin/bash
      - -lc
    command:
      - |
        set -a
        . /run/secrets/tokens.env
        set +a
        if [ -n "$${HUGGINGFACE_ACCESS_TOKENS:-}" ]; then
          export HF_TOKEN="$${HUGGINGFACE_ACCESS_TOKENS}"
          export HUGGING_FACE_HUB_TOKEN="$${HUGGINGFACE_ACCESS_TOKENS}"
        fi
        exec vllm serve Qwen/Qwen3-VL-2B-Instruct-FP8 \
          --served-model-name active-model \
          --host 0.0.0.0 \
          --port 8000 \
          --tensor-parallel-size 1 \
          --trust-remote-code \
          --dtype auto \
          --kv-cache-dtype fp8 \
          --gpu-memory-utilization 0.18 \
          --max-model-len 65536 \
          --max-num-seqs 1 \
          --max-num-batched-tokens 8192 \
          --enable-chunked-prefill \
          --enable-prefix-caching \
          --limit-mm-per-prompt '{"image": 1, "video": 0, "audio": 0}'

volumes:
  xtec-qwen3-vl-2b-instruct-cuda-vram8-vllm-qwen-fp8-64k-image-hf-cache:
    name: xtec-qwen3-vl-2b-instruct-cuda-vram8-vllm-qwen-fp8-64k-image-hf-cache
    external: true
  xtec-qwen3-vl-2b-instruct-cuda-vram8-vllm-qwen-fp8-64k-image-vllm-cache:
    name: xtec-qwen3-vl-2b-instruct-cuda-vram8-vllm-qwen-fp8-64k-image-vllm-cache
    external: true
