# Stop:    docker compose -f compose-ornith15-35b-a3b-cuda-vram128-vllm-nvfp4-100k-image.yml down
# Start:   docker compose -f compose-ornith15-35b-a3b-cuda-vram128-vllm-nvfp4-100k-image.yml up -d
# Logs:    docker logs -f --tail 80 ornith15_35b_a3b_cuda_vram128_vllm_nvfp4_100k_image
# Note:    Official Ornith-1.5 NVFP4 target using the model-card vLLM recipe.
#          No unvalidated DFlash/MTP draft is enabled.

services:
  ornith-vllm:
    image: vllm/vllm-openai:nightly
    pull_policy: missing
    container_name: ornith15_35b_a3b_cuda_vram128_vllm_nvfp4_100k_image

    environment:
      - HF_HOME=/root/.cache/huggingface
      - HUGGINGFACE_HUB_CACHE=/root/.cache/huggingface/hub
      - VLLM_CACHE_ROOT=/root/.cache/vllm
      - PYTORCH_ALLOC_CONF=expandable_segments:True
      - HF_XET_HIGH_PERFORMANCE=1
      - HF_HUB_DOWNLOAD_TIMEOUT=120
      - HF_HUB_ETAG_TIMEOUT=120
      - FLASHINFER_DISABLE_VERSION_CHECK=1
      - CUTE_DSL_ARCH=sm_121a
      - TORCH_MATMUL_PRECISION=high
      - VLLM_ALLOW_LONG_MAX_MODEL_LEN=1

    volumes:
      - ./tokens.env:/run/secrets/tokens.env:ro
      - xtec-ornith15-35b-a3b-cuda-vram128-vllm-nvfp4-100k-hf-cache:/root/.cache/huggingface
      - xtec-ornith15-35b-a3b-cuda-vram128-vllm-nvfp4-100k-vllm-cache:/root/.cache/vllm

    ports:
      - "8000:8000"

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/v1/models"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 45m

    ipc: host

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

    restart: unless-stopped

    entrypoint:
      - /bin/bash
      - -lc

    command:
      - |
        set -a
        . /run/secrets/tokens.env
        set +a

        if [ -n "$${HUGGINGFACE_ACCESS_TOKENS:-}" ]; then
          export HF_TOKEN="$${HUGGINGFACE_ACCESS_TOKENS}"
          export HUGGING_FACE_HUB_TOKEN="$${HUGGINGFACE_ACCESS_TOKENS}"
        fi

        exec vllm serve ornith-ai/Ornith-1.5-35B-A3B-NVFP4 \
          --served-model-name active-model \
          --host 0.0.0.0 \
          --port 8000 \
          --tensor-parallel-size 1 \
          --trust-remote-code \
          --dtype auto \
          --kv-cache-dtype auto \
          --gpu-memory-utilization 0.85 \
          --max-model-len 100000 \
          --max-num-seqs 16 \
          --max-num-batched-tokens 8192 \
          --enable-chunked-prefill \
          --enable-prefix-caching \
          --limit-mm-per-prompt '{"image":4,"video":0}' \
          --reasoning-parser qwen3 \
          --tool-call-parser qwen3_xml \
          --enable-auto-tool-choice

volumes:
  xtec-ornith15-35b-a3b-cuda-vram128-vllm-nvfp4-100k-hf-cache:
    name: xtec-ornith15-35b-a3b-cuda-vram128-vllm-nvfp4-100k-hf-cache
    external: true

  xtec-ornith15-35b-a3b-cuda-vram128-vllm-nvfp4-100k-vllm-cache:
    name: xtec-ornith15-35b-a3b-cuda-vram128-vllm-nvfp4-100k-vllm-cache
    external: true
