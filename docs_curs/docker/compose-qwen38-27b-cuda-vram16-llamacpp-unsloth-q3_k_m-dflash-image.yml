# Stop:    docker compose -f compose-qwen38-27b-cuda-vram16-llamacpp-unsloth-q3_k_m-dflash-image.yml down
# Restart: docker compose -f compose-qwen38-27b-cuda-vram16-llamacpp-unsloth-q3_k_m-dflash-image.yml up -d
# Logs:    docker logs -f --tail 80 qwen38_27b_cuda_vram16_llamacpp_unsloth_q3_k_m_dflash_image
# Note:    Qwen3.8 27B Q3_K_M GGUF for a 16GB GPU. --fit selects a safe partial GPU offload.
#          DFlash uses an experimental Qwen3.6-to-Qwen3.8 bootstrap drafter kept on CPU.
services:
  qwen-llamacpp:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    pull_policy: always
    container_name: qwen38_27b_cuda_vram16_llamacpp_unsloth_q3_k_m_dflash_image
    environment:
      - HF_HOME=/root/.cache/huggingface
      - HUGGINGFACE_HUB_CACHE=/root/.cache/huggingface/hub
      - LLAMA_CACHE=/root/.cache/llama.cpp
    volumes:
      - ./tokens.env:/run/secrets/tokens.env:ro
      - xtec-qwen38-27b-cuda-vram16-llamacpp-unsloth-q3_k_m-dflash-image-hf-cache:/root/.cache/huggingface
      - xtec-qwen38-27b-cuda-vram16-llamacpp-unsloth-q3_k_m-dflash-image-gguf-cache:/root/.cache/llama.cpp
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/v1/models >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30m
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -lc
    command:
      - |
        set -a
        . /run/secrets/tokens.env
        set +a
        if [ -n "$${HUGGINGFACE_ACCESS_TOKENS:-}" ]; then
          export HF_TOKEN="$${HUGGINGFACE_ACCESS_TOKENS}"
          export HUGGING_FACE_HUB_TOKEN="$${HUGGINGFACE_ACCESS_TOKENS}"
        fi
        echo "Starting llama.cpp server for unsloth/Qwen3.8-27B-GGUF:Q3_K_M on 0.0.0.0:8000"
        echo "DFlash draft: mrchuy/Qwen3.8-27B-DFlash-drafter-bootstrap-GGUF (CPU)"
        echo "Model cache: $${LLAMA_CACHE}"
        exec /app/llama-server \
          -hf unsloth/Qwen3.8-27B-GGUF:Q3_K_M \
          --mmproj-url https://huggingface.co/unsloth/Qwen3.8-27B-GGUF/resolve/main/mmproj-BF16.gguf \
          --no-mmproj-offload \
          --alias active-model \
          --host 0.0.0.0 \
          --port 8000 \
          --log-timestamps \
          --log-prefix \
          --verbose \
          --fit on \
          --fit-ctx 4096 \
          -c 8192 \
          -np 1 \
          -b 512 \
          -ub 128 \
          --temp 0.6 \
          --top-p 0.95 \
          --top-k 20 \
          -cb \
          -fa on \
          -ctk q8_0 \
          -ctv q8_0 \
          --spec-type draft-dflash \
          --spec-draft-hf mrchuy/Qwen3.8-27B-DFlash-drafter-bootstrap-GGUF \
          --spec-draft-n-max 3 \
          --spec-draft-ngl 0 \
          --reasoning on \
          --reasoning-format deepseek \
          --chat-template-kwargs '{"enable_thinking":true}'

volumes:
  xtec-qwen38-27b-cuda-vram16-llamacpp-unsloth-q3_k_m-dflash-image-hf-cache:
    name: xtec-qwen38-27b-cuda-vram16-llamacpp-unsloth-q3_k_m-dflash-image-hf-cache
    external: true
  xtec-qwen38-27b-cuda-vram16-llamacpp-unsloth-q3_k_m-dflash-image-gguf-cache:
    name: xtec-qwen38-27b-cuda-vram16-llamacpp-unsloth-q3_k_m-dflash-image-gguf-cache
    external: true
