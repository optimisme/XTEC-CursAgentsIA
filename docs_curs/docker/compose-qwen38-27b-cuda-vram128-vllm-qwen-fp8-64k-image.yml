# Stop:    docker compose -f compose-qwen38-27b-cuda-vram128-vllm-qwen-fp8-64k-image.yml down
# Start:   docker compose -f compose-qwen38-27b-cuda-vram128-vllm-qwen-fp8-64k-image.yml up -d
# Logs:    docker logs -f --tail 80 qwen38_27b_cuda_vram128_vllm_qwen_fp8_64k_image
# Note:    Official Qwen3.8 27B FP8 checkpoint with its native one-layer MTP
#          head enabled for one-token speculative decoding. Sampling defaults
#          follow the official Qwen thinking-mode recommendations; KV stays at
#          model dtype because this checkpoint has no calibrated FP8 KV scales.

services:
  qwen-vllm:
    image: vllm/vllm-openai:nightly
    pull_policy: always
    container_name: qwen38_27b_cuda_vram128_vllm_qwen_fp8_64k_image

    environment:
      - HF_HOME=/root/.cache/huggingface
      - HUGGINGFACE_HUB_CACHE=/root/.cache/huggingface/hub
      - VLLM_CACHE_ROOT=/root/.cache/vllm
      - PYTORCH_ALLOC_CONF=expandable_segments:True
      - HF_HUB_DISABLE_XET=1
      - HF_HUB_ENABLE_HF_TRANSFER=1
      - FLASHINFER_DISABLE_VERSION_CHECK=1
      - CUTE_DSL_ARCH=sm_121a
      - TORCH_MATMUL_PRECISION=high
      - VLLM_ALLOW_LONG_MAX_MODEL_LEN=1

    volumes:
      - ./tokens.env:/run/secrets/tokens.env:ro
      - xtec-qwen38-27b-cuda-vram128-vllm-qwen-fp8-64k-image-hf-cache:/root/.cache/huggingface
      - xtec-qwen38-27b-cuda-vram128-vllm-qwen-fp8-64k-image-vllm-cache:/root/.cache/vllm

    ports:
      - "8000:8000"

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/v1/models"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 45m

    ipc: host

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

    restart: unless-stopped

    entrypoint:
      - /bin/bash
      - -lc

    command:
      - |
        set -a
        . /run/secrets/tokens.env
        set +a

        if [ -n "$${HUGGINGFACE_ACCESS_TOKENS:-}" ]; then
          export HF_TOKEN="$${HUGGINGFACE_ACCESS_TOKENS}"
          export HUGGING_FACE_HUB_TOKEN="$${HUGGINGFACE_ACCESS_TOKENS}"
        fi

        exec vllm serve Qwen/Qwen3.8-27B-FP8 \
          --served-model-name active-model \
          --host 0.0.0.0 \
          --port 8000 \
          --tensor-parallel-size 1 \
          --trust-remote-code \
          --dtype auto \
          --kv-cache-dtype auto \
          --gpu-memory-utilization 0.75 \
          --max-model-len 65536 \
          --max-num-seqs 8 \
          --max-num-batched-tokens 2096 \
          --enable-chunked-prefill \
          --enable-prefix-caching \
          --limit-mm-per-prompt '{"image":5,"video":0}' \
          --generation-config auto \
          --override-generation-config '{"temperature":1.0,"top_p":0.95,"top_k":20,"min_p":0.0,"presence_penalty":0.0,"repetition_penalty":1.0}' \
          --speculative-config '{"method":"mtp","num_speculative_tokens":1}' \
          --reasoning-parser qwen3 \
          --tool-call-parser qwen3_coder \
          --enable-auto-tool-choice

volumes:
  xtec-qwen38-27b-cuda-vram128-vllm-qwen-fp8-64k-image-hf-cache:
    name: xtec-qwen38-27b-cuda-vram128-vllm-qwen-fp8-64k-image-hf-cache
    external: true

  xtec-qwen38-27b-cuda-vram128-vllm-qwen-fp8-64k-image-vllm-cache:
    name: xtec-qwen38-27b-cuda-vram128-vllm-qwen-fp8-64k-image-vllm-cache
    external: true
