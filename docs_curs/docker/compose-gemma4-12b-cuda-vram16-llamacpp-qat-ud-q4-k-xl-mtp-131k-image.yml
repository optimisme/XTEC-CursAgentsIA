# Stop:    docker compose -f compose-gemma4-12b-cuda-vram16-llamacpp-qat-ud-q4-k-xl-mtp-131k-image.yml down
# Restart: docker compose -f compose-gemma4-12b-cuda-vram16-llamacpp-qat-ud-q4-k-xl-mtp-131k-image.yml up -d
# Logs:    docker logs -f --tail 80 gemma4_12b_cuda_vram16_llamacpp_qat_ud_q4_k_xl_mtp_131k_image
# Source configuration translated from the supplied Gemma-4-12B llama.cpp batch file.
services:
  gemma4-12b-cuda-vram16-llamacpp-qat-ud-q4-k-xl-mtp-131k-image:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    pull_policy: always
    container_name: gemma4_12b_cuda_vram16_llamacpp_qat_ud_q4_k_xl_mtp_131k_image
    restart: unless-stopped
    ipc: host
    ports:
      - "8000:8000"
    volumes:
      - ./tokens.env:/run/secrets/tokens.env:ro
      - xtec-gemma4-12b-cuda-vram16-llamacpp-qat-ud-q4-k-xl-mtp-131k-image-hf-cache:/root/.cache/huggingface
      - xtec-gemma4-12b-cuda-vram16-llamacpp-qat-ud-q4-k-xl-mtp-131k-image-gguf-cache:/root/.cache/llama.cpp
    environment:
      HF_HOME: /root/.cache/huggingface
      HUGGINGFACE_HUB_CACHE: /root/.cache/huggingface/hub
      LLAMA_CACHE: /root/.cache/llama.cpp
    entrypoint: ["/bin/sh", "-lc"]
    command:
      - >-
        set -a; . /run/secrets/tokens.env 2>/dev/null || true; set +a;
        if [ -n "$${HUGGINGFACE_ACCESS_TOKENS:-}" ]; then
          export HF_TOKEN="$${HUGGINGFACE_ACCESS_TOKENS}";
          export HUGGING_FACE_HUB_TOKEN="$${HUGGINGFACE_ACCESS_TOKENS}";
        fi;
        exec /app/llama-server
        -hf unsloth/gemma-4-12B-it-qat-GGUF
        -hff gemma-4-12B-it-qat-UD-Q4_K_XL.gguf
        --mmproj-url https://huggingface.co/unsloth/gemma-4-12B-it-qat-GGUF/resolve/main/mmproj-BF16.gguf
        --hf-repo-draft unsloth/gemma-4-12B-it-qat-GGUF
        --alias active-model
        --host 0.0.0.0
        --port 8000
        --spec-type draft-mtp
        --spec-draft-n-max 2
        --fit off
        --load-mode none
        --gpu-layers all
        --threads 6
        --threads-batch 12
        --reasoning on
        --ctx-size 131072
        --temp 1.0
        --top-p 0.95
        --top-k 64
        --parallel 1
        --kv-unified
        --log-verbosity 4
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45m

volumes:
  xtec-gemma4-12b-cuda-vram16-llamacpp-qat-ud-q4-k-xl-mtp-131k-image-hf-cache:
    name: xtec-gemma4-12b-cuda-vram16-llamacpp-qat-ud-q4-k-xl-mtp-131k-image-hf-cache
    external: true
  xtec-gemma4-12b-cuda-vram16-llamacpp-qat-ud-q4-k-xl-mtp-131k-image-gguf-cache:
    name: xtec-gemma4-12b-cuda-vram16-llamacpp-qat-ud-q4-k-xl-mtp-131k-image-gguf-cache
    external: true
