<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snake</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #1a1a2e;
      font-family: Arial, Helvetica, sans-serif;
      color: #eee;
    }

    h1 {
      margin-bottom: 10px;
      color: #4ecca3;
    }

    #hud {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 12px;
    }

    #score {
      font-size: 20px;
      font-weight: bold;
      background: #16213e;
      padding: 8px 16px;
      border-radius: 6px;
      min-width: 110px;
      text-align: center;
    }

    button {
      font-size: 15px;
      padding: 8px 18px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      background: #4ecca3;
      color: #16213e;
      font-weight: bold;
    }

    button:hover {
      background: #3db392;
    }

    #pauseBtn {
      background: #e94560;
      color: #fff;
    }

    #pauseBtn:hover {
      background: #c73650;
    }

    canvas {
      border: 3px solid #4ecca3;
      border-radius: 4px;
      background: #16213e;
    }

    #message {
      margin-top: 10px;
      font-size: 16px;
      color: #aaa;
      height: 22px;
    }
  </style>
</head>
<body>
  <h1>Snake</h1>
  <div id="hud">
    <div id="score">Score: 0</div>
    <button id="pauseBtn" type="button">Pause</button>
    <button id="restartBtn" type="button">Restart</button>
  </div>
  <canvas id="board" width="400" height="400"></canvas>
  <div id="message">Press an arrow key to start</div>

  <script>
    var canvas = document.getElementById("board");
    var ctx = canvas.getContext("2d");
    var scoreEl = document.getElementById("score");
    var messageEl = document.getElementById("message");
    var pauseBtn = document.getElementById("pauseBtn");
    var restartBtn = document.getElementById("restartBtn");

    var GRID = 20;
    var CELLS = canvas.width / GRID;
    var SPEED = 120;

    var snake;
    var dir;
    var nextDir;
    var food;
    var score;
    var state;
    var timer = null;

    function reset() {
      snake = [
        { x: 8, y: 10 },
        { x: 7, y: 10 },
        { x: 6, y: 10 }
      ];
      dir = { x: 1, y: 0 };
      nextDir = { x: 1, y: 0 };
      score = 0;
      state = "waiting";
      scoreEl.textContent = "Score: 0";
      placeFood();
      messageEl.textContent = "Press an arrow key to start";
      stopLoop();
      draw();
    }

    function placeFood() {
      do {
        food = {
          x: Math.floor(Math.random() * CELLS),
          y: Math.floor(Math.random() * CELLS)
        };
      } while (snake.some(function (s) {
        return s.x === food.x && s.y === food.y;
      }));
    }

    function startLoop() {
      stopLoop();
      timer = setInterval(tick, SPEED);
    }

    function stopLoop() {
      if (timer !== null) {
        clearInterval(timer);
        timer = null;
      }
    }

    function tick() {
      dir = nextDir;
      var head = {
        x: snake[0].x + dir.x,
        y: snake[0].y + dir.y
      };

      if (
        head.x < 0 || head.x >= CELLS ||
        head.y < 0 || head.y >= CELLS ||
        snake.some(function (s) {
          return s.x === head.x && s.y === head.y;
        })
      ) {
        gameOver();
        return;
      }

      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        score += 10;
        scoreEl.textContent = "Score: " + score;
        placeFood();
      } else {
        snake.pop();
      }

      draw();
    }

    function gameOver() {
      state = "over";
      stopLoop();
      draw();
      messageEl.textContent = "Game over! Final score: " + score + " - press Restart";
    }

    function togglePause() {
      if (state === "playing") {
        state = "paused";
        stopLoop();
        pauseBtn.textContent = "Resume";
        messageEl.textContent = "Paused";
        draw();
      } else if (state === "paused") {
        state = "playing";
        startLoop();
        pauseBtn.textContent = "Pause";
        messageEl.textContent = "";
      } else {
        messageEl.textContent = "Press an arrow key to start";
      }
    }

    function draw() {
      ctx.fillStyle = "#16213e";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "#e94560";
      ctx.fillRect(
        food.x * GRID + 2,
        food.y * GRID + 2,
        GRID - 4,
        GRID - 4
      );

      for (var i = 0; i < snake.length; i++) {
        ctx.fillStyle = i === 0 ? "#4ecca3" : "#3a9d7e";
        ctx.fillRect(
          snake[i].x * GRID + 1,
          snake[i].y * GRID + 1,
          GRID - 2,
          GRID - 2
        );
      }

      if (state === "paused" || state === "over") {
        ctx.fillStyle = "rgba(0, 0, 0, 0.6)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#fff";
        ctx.font = "bold 28px Arial";
        ctx.textAlign = "center";
        ctx.fillText(
          state === "paused" ? "PAUSED" : "GAME OVER",
          canvas.width / 2,
          canvas.height / 2
        );
      }
    }

    document.addEventListener("keydown", function (e) {
      var key = e.key;
      var move = null;

      if (key === "ArrowUp") move = { x: 0, y: -1 };
      else if (key === "ArrowDown") move = { x: 0, y: 1 };
      else if (key === "ArrowLeft") move = { x: -1, y: 0 };
      else if (key === "ArrowRight") move = { x: 1, y: 0 };

      if (!move) return;
      e.preventDefault();

      if (state === "waiting") {
        if (move.x === -dir.x && move.y === -dir.y) return;
        state = "playing";
        nextDir = move;
        pauseBtn.textContent = "Pause";
        messageEl.textContent = "";
        startLoop();
        return;
      }

      if (state !== "playing") return;
      if (move.x === -dir.x && move.y === -dir.y) return;
      nextDir = move;
    });

    pauseBtn.addEventListener("click", togglePause);
    restartBtn.addEventListener("click", reset);

    reset();
  </script>
</body>
</html>
