<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tetris</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #1a1a2e;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 20px;
        }

        .game-container {
            display: flex;
            gap: 20px;
            margin: 0 auto;
            align-items: flex-start;
        }

        #game-canvas {
            border: 2px solid #ffffff;
            background-color: #000000;
            display: block;
        }

        .side-panel {
            background-color: #16213e;
            border: 2px solid #ffffff;
            border-radius: 8px;
            padding: 20px;
            min-width: 150px;
        }

        .panel-section {
            margin-bottom: 20px;
        }

        .panel-section h3 {
            font-size: 14px;
            text-transform: uppercase;
            color: #aaaaaa;
            margin-bottom: 8px;
        }

        #score, #level, #lines {
            font-size: 24px;
            font-weight: bold;
            color: #ffffff;
        }

        #next-piece {
            background-color: #000000;
            border: 1px solid #444444;
            display: block;
            margin-top: 8px;
        }

        .game-over-overlay {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 240px;
            height: 400px;
            background-color: rgba(0, 0, 0, 0.85);
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .game-over-overlay.visible {
            display: flex;
        }

        .game-over-overlay h2 {
            font-size: 24px;
            color: #ff4444;
            margin-bottom: 10px;
        }

        .game-over-overlay p {
            font-size: 16px;
            color: #ffffff;
            margin-bottom: 20px;
        }

        .game-over-overlay button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        .game-over-overlay button:hover {
            background-color: #45a049;
        }

        .canvas-wrapper {
            position: relative;
            display: inline-block;
        }

        .controls-info {
            font-size: 11px;
            color: #888888;
            margin-top: 20px;
            line-height: 1.6;
        }

        .controls-info kbd {
            background-color: #333;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 10px;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="canvas-wrapper">
            <canvas id="game-canvas" width="240" height="400"></canvas>
            <div class="game-over-overlay" id="game-over-overlay">
                <h2>GAME OVER</h2>
                <p id="final-score">Puntuació: 0</p>
                <button id="restart-button">Play Again</button>
            </div>
        </div>
        <div class="side-panel">
            <div class="panel-section">
                <h3>Puntuació</h3>
                <div id="score">0</div>
            </div>
            <div class="panel-section">
                <h3>Nivell</h3>
                <div id="level">1</div>
            </div>
            <div class="panel-section">
                <h3>Línies</h3>
                <div id="lines">0</div>
            </div>
            <div class="panel-section">
                <h3>Següent</h3>
                <canvas id="next-piece" width="80" height="80"></canvas>
            </div>
            <div class="controls-info">
                <strong>Controls:</strong><br>
                <kbd>←</kbd> <kbd>→</kbd> Moure<br>
                <kbd>↓</kbd> Baixar<br>
                <kbd>↑</kbd> <kbd>Espai</kbd> Lliure<br>
                <kbd>W</kbd> <kbd>↑</kbd> Rotar<br>
                <kbd>Enter</kbd> Reiniciar
            </div>
        </div>
    </div>
    <script src="tetris.js"></script>
</body>
</html>
