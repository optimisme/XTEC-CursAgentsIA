<svg xmlns="http://www.w3.org/2000/svg" width="980" height="360" viewBox="0 0 980 360" role="img" aria-labelledby="title desc">
  <title id="title">Flux principal de function calling</title>
  <desc id="desc">Usuari, model amb schema d'eines, tool calls, servidor que normalitza i client que executa a l'aplicació.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      .title { font: 700 26px Arial, Helvetica, sans-serif; fill: #0f172a; }
      .box { fill: #ffffff; stroke: #cbd5e1; }
      .accent { fill: #e0f2fe; stroke: #38bdf8; }
      .label { font: 700 17px Arial, Helvetica, sans-serif; fill: #0f172a; }
      .small { font: 12px Arial, Helvetica, sans-serif; fill: #475569; }
    </style>
  </defs>
  <rect width="980" height="360" fill="#f8fafc"/>
  <text x="490" y="42" text-anchor="middle" class="title">Flux principal de function calling</text>
  <text x="490" y="70" text-anchor="middle" class="small">El model decideix una acció, però el servidor valida i normalitza abans d'executar.</text>

  <g>
    <rect x="42" y="128" width="128" height="104" rx="14" class="box"/>
    <text x="106" y="166" text-anchor="middle" class="label">Usuari</text>
    <text x="106" y="190" text-anchor="middle" class="small">prompt natural</text>
    <text x="106" y="210" text-anchor="middle" class="small">en qualsevol idioma</text>
  </g>
  <g>
    <rect x="238" y="108" width="144" height="144" rx="14" class="accent"/>
    <text x="310" y="150" text-anchor="middle" class="label">Model</text>
    <text x="310" y="174" text-anchor="middle" class="small">+ tools schema</text>
    <text x="310" y="194" text-anchor="middle" class="small">funcions i paràmetres</text>
    <text x="310" y="214" text-anchor="middle" class="small">disponibles</text>
  </g>
  <g>
    <rect x="450" y="128" width="144" height="104" rx="14" class="box"/>
    <text x="522" y="166" text-anchor="middle" class="label">tool_calls</text>
    <text x="522" y="190" text-anchor="middle" class="small">funció</text>
    <text x="522" y="210" text-anchor="middle" class="small">+ arguments</text>
  </g>
  <g>
    <rect x="662" y="118" width="144" height="124" rx="14" class="accent"/>
    <text x="734" y="156" text-anchor="middle" class="label">Servidor</text>
    <text x="734" y="180" text-anchor="middle" class="small">parseja</text>
    <text x="734" y="200" text-anchor="middle" class="small">valida</text>
    <text x="734" y="220" text-anchor="middle" class="small">normalitza</text>
  </g>
  <g>
    <rect x="874" y="128" width="80" height="104" rx="14" class="box"/>
    <text x="914" y="166" text-anchor="middle" class="label">Client</text>
    <text x="914" y="190" text-anchor="middle" class="small">executa</text>
    <text x="914" y="210" text-anchor="middle" class="small">aplicació</text>
  </g>

  <rect x="398" y="282" width="184" height="44" rx="22" fill="#ecfdf5" stroke="#86efac"/>
  <text x="490" y="309" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#166534">Traça visible: funció + arguments crus</text>

  <g stroke="#334155" stroke-width="3" marker-end="url(#arrow)">
    <line x1="170" y1="180" x2="238" y2="180"/>
    <line x1="382" y1="180" x2="450" y2="180"/>
    <line x1="594" y1="180" x2="662" y2="180"/>
    <line x1="806" y1="180" x2="874" y2="180"/>
  </g>
</svg>
