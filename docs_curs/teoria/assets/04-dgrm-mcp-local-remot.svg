<svg xmlns="http://www.w3.org/2000/svg" width="980" height="430" viewBox="0 0 980 430" role="img" aria-labelledby="title desc">
  <title id="title">MCP local vs MCP remot</title>
  <desc id="desc">Dues columnes comparen un agent connectat a un MCP local amb eina local i un agent connectat a un MCP remot amb servei extern o OAuth.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      .title { font: 700 26px Arial, Helvetica, sans-serif; fill: #0f172a; }
      .label { font: 700 18px Arial, Helvetica, sans-serif; fill: #0f172a; }
      .small { font: 13px Arial, Helvetica, sans-serif; fill: #475569; }
    </style>
  </defs>
  <rect width="980" height="430" fill="#f8fafc"/>
  <text x="490" y="44" text-anchor="middle" class="title">MCP local vs MCP remot</text>
  <line x1="490" y1="92" x2="490" y2="390" stroke="#cbd5e1" stroke-width="2"/>

  <text x="245" y="100" text-anchor="middle" class="label">MCP local</text>
  <text x="735" y="100" text-anchor="middle" class="label">MCP remot</text>

  <rect x="50" y="166" width="95" height="88" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="98" y="204" text-anchor="middle" class="label">Agent</text>
  <text x="98" y="228" text-anchor="middle" class="small">OpenCode</text>
  <rect x="218" y="150" width="114" height="120" rx="14" fill="#e0f2fe" stroke="#38bdf8"/>
  <text x="275" y="195" text-anchor="middle" class="label">MCP</text>
  <text x="275" y="219" text-anchor="middle" class="small">local</text>
  <rect x="405" y="166" width="95" height="88" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="453" y="204" text-anchor="middle" class="label">Eina</text>
  <text x="453" y="228" text-anchor="middle" class="small">local</text>

  <rect x="540" y="166" width="95" height="88" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="588" y="204" text-anchor="middle" class="label">Agent</text>
  <text x="588" y="228" text-anchor="middle" class="small">OpenCode</text>
  <rect x="708" y="150" width="114" height="120" rx="14" fill="#e0f2fe" stroke="#38bdf8"/>
  <text x="765" y="195" text-anchor="middle" class="label">MCP</text>
  <text x="765" y="219" text-anchor="middle" class="small">remot</text>
  <rect x="895" y="166" width="75" height="88" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="933" y="198" text-anchor="middle" class="label">Servei</text>
  <text x="933" y="222" text-anchor="middle" class="small">OAuth/API</text>

  <text x="245" y="330" text-anchor="middle" class="small">S'executa a la màquina o al projecte.</text>
  <text x="735" y="330" text-anchor="middle" class="small">S'executa fora i pot requerir autenticació.</text>

  <g stroke="#334155" stroke-width="3" marker-end="url(#arrow)">
    <line x1="145" y1="210" x2="218" y2="210"/>
    <line x1="332" y1="210" x2="405" y2="210"/>
    <line x1="635" y1="210" x2="708" y2="210"/>
    <line x1="822" y1="210" x2="895" y2="210"/>
  </g>
</svg>
