<svg xmlns="http://www.w3.org/2000/svg" width="980" height="340" viewBox="0 0 980 340" role="img" aria-labelledby="title desc">
  <title id="title">Flux OAuth d'un MCP remot</title>
  <desc id="desc">Seqüència d'autenticació OAuth: OpenCode, ordre auth, navegador o proveïdor, token i MCP disponible.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      .title { font: 700 26px Arial, Helvetica, sans-serif; fill: #0f172a; }
      .label { font: 700 16px Arial, Helvetica, sans-serif; fill: #0f172a; }
      .small { font: 12px Arial, Helvetica, sans-serif; fill: #475569; }
    </style>
  </defs>
  <rect width="980" height="340" fill="#f8fafc"/>
  <text x="490" y="44" text-anchor="middle" class="title">Flux OAuth d'un MCP remot</text>

  <rect x="50" y="126" width="105" height="88" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="103" y="164" text-anchor="middle" class="label">OpenCode</text>
  <text x="103" y="188" text-anchor="middle" class="small">detecta MCP</text>

  <rect x="230" y="126" width="125" height="88" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="293" y="164" text-anchor="middle" class="label">auth</text>
  <text x="293" y="188" text-anchor="middle" class="small">inicia login</text>

  <rect x="430" y="116" width="155" height="108" rx="14" fill="#e0f2fe" stroke="#38bdf8"/>
  <text x="508" y="158" text-anchor="middle" class="label">Navegador</text>
  <text x="508" y="182" text-anchor="middle" class="small">proveïdor OAuth</text>
  <text x="508" y="202" text-anchor="middle" class="small">usuari autoritza</text>

  <rect x="660" y="126" width="125" height="88" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="723" y="164" text-anchor="middle" class="label">Token</text>
  <text x="723" y="188" text-anchor="middle" class="small">guardat</text>

  <rect x="860" y="126" width="100" height="88" rx="14" fill="#ecfdf5" stroke="#86efac"/>
  <text x="910" y="164" text-anchor="middle" class="label">MCP</text>
  <text x="910" y="188" text-anchor="middle" class="small">disponible</text>

  <g stroke="#334155" stroke-width="3" marker-end="url(#arrow)">
    <line x1="155" y1="170" x2="230" y2="170"/>
    <line x1="355" y1="170" x2="430" y2="170"/>
    <line x1="585" y1="170" x2="660" y2="170"/>
    <line x1="785" y1="170" x2="860" y2="170"/>
  </g>
</svg>
