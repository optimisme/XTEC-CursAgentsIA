<svg xmlns="http://www.w3.org/2000/svg" width="980" height="430" viewBox="0 0 980 430" role="img" aria-labelledby="title desc">
  <title id="title">Structured Outputs vs Function Calling</title>
  <desc id="desc">Comparació entre un model que retorna JSON de dades i un model que retorna una acció o eina amb arguments.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      .title { font: 700 26px Arial, Helvetica, sans-serif; fill: #0f172a; }
      .label { font: 700 18px Arial, Helvetica, sans-serif; fill: #0f172a; }
      .small { font: 13px Arial, Helvetica, sans-serif; fill: #475569; }
      .mono { font: 13px Menlo, Consolas, monospace; fill: #334155; }
    </style>
  </defs>
  <rect width="980" height="430" fill="#f8fafc"/>
  <text x="490" y="44" text-anchor="middle" class="title">Structured Outputs vs Function Calling</text>
  <text x="490" y="72" text-anchor="middle" class="small">Tots dos estructuren la resposta, però tenen objectius diferents.</text>

  <rect x="395" y="112" width="190" height="72" rx="14" fill="#e0f2fe" stroke="#38bdf8"/>
  <text x="490" y="143" text-anchor="middle" class="label">Model</text>
  <text x="490" y="164" text-anchor="middle" class="small">interpreta la petició</text>

  <g>
    <rect x="70" y="285" width="310" height="108" rx="16" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="225" y="318" text-anchor="middle" class="label">Structured output</text>
    <text x="225" y="343" text-anchor="middle" class="small">dades amb forma concreta</text>
    <text x="105" y="372" class="mono">{ "priority": "high" }</text>
  </g>
  <g>
    <rect x="600" y="285" width="310" height="108" rx="16" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="755" y="318" text-anchor="middle" class="label">Function calling</text>
    <text x="755" y="343" text-anchor="middle" class="small">acció/eina + arguments</text>
    <text x="635" y="372" class="mono">draw_circle({ fillColor })</text>
  </g>

  <text x="225" y="236" text-anchor="middle" class="small">Extreure, classificar, transformar</text>
  <text x="755" y="236" text-anchor="middle" class="small">Decidir què cal executar</text>

  <path d="M 440 184 C 300 215 235 245 205 285" stroke="#334155" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M 540 184 C 680 215 745 245 775 285" stroke="#334155" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
</svg>
