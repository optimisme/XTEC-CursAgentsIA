<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barcelona Weather Card</title>
    <link rel="stylesheet" href="weather.css">
</head>
<body>
    <div id="weather-container">
        <h1 id="city-name">Loading City...</h1>
        <div class="weather-card">
            <div id="weather-display">
                <div id="condition">Loading Condition...</div>
                <div id="temperature" class="main-temp">--°C</div>
            </div>
            <div id="details">
                <div class="detail-item">Humidity: <span id="humidity">--%</span></div>
                <div class="detail-item">Wind: <span id="wind">-- km/h</span></div>
                <div class="detail-item">Last Updated: <span id="update-time">--</span></div>
            </div>
        </div>
    </div>
    <footer>
        <p class="source-citation">Weather data provided by <a href="https://www.accuweather.com/">AccuWeather</a>.</p>
    </footer>
    <script src="weather.js"></script>
</body>
</html>
