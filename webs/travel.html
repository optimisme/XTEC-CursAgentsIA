<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Girona Travel Guide</title>
    <link rel="stylesheet" href="travel.css">
</head>
<body>
    <header>
        <h1>Welcome to Girona!</h1>
        <p>Discover the magic of this Catalan gem with our mini travel guide.</p>
    </header>

    <main id="guide-container">
        <section id="controls">
            <h2>Explore Girona</h2>
            <div class="filters">
                <label for="category-filter">Filter by Category:</label>
                <select id="category-filter">
                    <option value="all">All Attractions</option>
                    <option value="Architecture">Architecture</option>
                    <option value="History">History</option>
                    <option value="Scenic">Scenic</option>
                </select>
            </div>
        </section>
        <div id="attractions-grid" class="card-grid">
            <!-- Attraction cards will be injected here by JavaScript -->
            <p id="loading-message">Loading attractions...</p>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Girona Guide. Sources: Girona Tour, TripAdvisor, Along Dusty Roads, etc.</p>
    </footer>

    <script src="travel.js"></script>
</body>
</html>
