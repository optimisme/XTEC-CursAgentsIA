<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slider Puzzle 3x3</title>
    <link rel="stylesheet" href="slider.css">
</head>
<body>
    <div class="container">
        <h1>Slider Puzzle</h1>
        <p class="subtitle">Arrange numbers 1-8 in order</p>
        <div class="board" id="board">
            <div class="tile" data-value="1">1</div>
            <div class="tile" data-value="2">2</div>
            <div class="tile" data-value="3">3</div>
            <div class="tile" data-value="4">4</div>
            <div class="tile" data-value="5">5</div>
            <div class="tile" data-value="6">6</div>
            <div class="tile" data-value="7">7</div>
            <div class="tile" data-value="8">8</div>
            <div class="tile empty" data-value="0"></div>
        </div>
        <div class="controls">
            <button id="shuffleBtn" onclick="shuffleBoard()">Shuffle</button>
            <button id="resetBtn" onclick="resetBoard()">Reset</button>
        </div>
        <div class="stats">
            <div class="stat">
                <span class="stat-label">Moves</span>
                <span class="stat-value" id="moves">0</span>
            </div>
            <div class="stat">
                <span class="stat-label">Time</span>
                <span class="stat-value" id="time">00:00</span>
            </div>
        </div>
        <div class="message" id="message"></div>
    </div>
    <script src="slider.js"></script>
</body>
</html>
