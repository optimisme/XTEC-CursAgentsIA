<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polished To-Do List</title>
    <link rel="stylesheet" href="todo.css">
</head>
<body>
    <div id="appContainer">
        <h1>My To-Do List</h1>
        
        <div id="inputSection">
            <input type="text" id="taskInput" placeholder="Add a new task...">
            <button id="addTaskBtn">Add Task</button>
        </div>

        <div id="filters">
            <button id="filterAll" data-filter="all">All</button>
            <button id="filterActive" data-filter="active">Active</button>
            <button id="filterCompleted" data-filter="completed">Completed</button>
        </div>

        <ul id="taskList">
            <!-- Tasks will be injected here -->
        </ul>
        
        <div id="actions">
            <button id="clearCompletedBtn">Clear Completed</button>
        </div>
    </div>

    <script src="todo.js"></script>
</body>
</html>
