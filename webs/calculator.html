<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Santronics 90S Calculator</title>
    <link rel="stylesheet" href="calculator.css">
</head>
<body>
    <div class="calculator">
        <div class="power-section">
            <div class="power-label">ON</div>
            <label class="toggle">
                <input type="checkbox" id="powerToggle" checked>
                <span class="slider"></span>
            </label>
            <div class="power-label">OFF</div>
        </div>
        <div class="brand">SANTRONICS 90S</div>
        <div class="screen" id="display">0</div>
        <div class="buttons">
            <div class="btn-row">
                <button class="btn-function" data-action="percent">%</button>
                <button class="btn-number" data-value="7">7</button>
                <button class="btn-number" data-value="8">8</button>
                <button class="btn-number" data-value="9">9</button>
                <button class="btn-operator" data-action="divide">÷</button>
            </div>
            <div class="btn-row">
                <button class="btn-function" data-action="sqrt">√</button>
                <button class="btn-number" data-value="4">4</button>
                <button class="btn-number" data-value="5">5</button>
                <button class="btn-number" data-value="6">6</button>
                <button class="btn-operator" data-action="multiply">×</button>
            </div>
            <div class="btn-row">
                <button class="btn-function pi-btn" data-action="pi">π</button>
                <button class="btn-number" data-value="1">1</button>
                <button class="btn-number" data-value="2">2</button>
                <button class="btn-number" data-value="3">3</button>
                <button class="btn-operator" data-action="add">+</button>
            </div>
            <div class="btn-row">
                <button class="btn-function" data-action="sign">+/-</button>
                <button class="btn-number" data-value="0">0</button>
                <button class="btn-dot" data-action="dot">.</button>
                <button class="btn-operator" data-action="subtract">−</button>
                <button class="btn-equals" data-action="equals">=</button>
            </div>
            <div class="btn-row">
                <button class="btn-clear" data-action="clear">C</button>
                <button class="btn-clear-entry" data-action="clearEntry">CE</button>
            </div>
        </div>
        <div class="powered-off" id="poweredOff">
            <div class="off-text">SANTRONICS 90S</div>
        </div>
    </div>
    <script src="calculator.js"></script>
</body>
</html>
