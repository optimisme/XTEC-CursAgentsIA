<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Notes App</h1>
    </header>

    <main>
        <section id="note-form">
            <form id="note-form-el">
                <label for="note-title">Title</label>
                <input type="text" id="note-title" placeholder="Enter note title" required>

                <label for="note-content">Content</label>
                <textarea id="note-content" rows="6" placeholder="Enter note content" required></textarea>

                <input type="hidden" id="note-id" value="">
                <button type="submit">Save Note</button>
            </form>
        </section>

        <section id="search-section">
            <label for="search-input">Search notes</label>
            <input type="search" id="search-input" placeholder="Search by title or content">
        </section>

        <section id="notes-container">
            <h2>Saved Notes</h2>
            <div id="notes-list"></div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
