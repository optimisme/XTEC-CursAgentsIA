<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asteroids Arcade</title>
    <link rel="stylesheet" href="asteroid.css">
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        <div id="hud">
            <div id="score-board">Score: <span id="score">0</span></div>
            <div id="high-score-board">High Score: <span id="high-score">0</span></div>
            <div id="lives-board">Lives: <span id="lives">3</span></div>
        </div>,
        <div id="overlay">
            <h1 id="overlay-title">ASTEROIDS</h1>,
            <p id="overlay-message">Press any key to start</p>
        </div>,
    </div>,
    <script src="asteroid.js"></script>
</body>,
</html>
