<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3x3 Slider Puzzle</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f0f0f0;
            font-family: sans-serif;
        }
        #puzzle-board {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            grid-template-rows: repeat(3, 100px);
            border: 3px solid #333;
            background-color: #ccc;
        }
        .tile {
            width: 100px;
            height: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 3em;
            font-weight: bold;
            cursor: pointer;
            border: 1px solid #aaa;
            transition: transform 0.1s ease-in-out;
            user-select: none; /* Prevent text selection */
            box-sizing: border-box;
        }
        .tile:hover {
            background-color: #e0e0e0;
        }
        .empty {
            background-color: #a9a9a9; /* Gray for the empty slot */
            cursor: default;
            visibility: hidden; /* Optionally hide it, though keeping it visible helps debugging the grid */
        }
        #message {
            margin-top: 20px;
            font-size: 1.5em;
            color: green;
        }
    </style>
</head>
<body>
    <div id="puzzle-board">
        <!-- Tiles will be generated here by JS -->
    </div>
    <div id="message"></div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const boardElement = document.getElementById('puzzle-board');
            const messageElement = document.getElementById('message');
            const size = 3;
            const totalTiles = size * size;

            // Initial puzzle state (shuffle needed)
            // We initialize a solved state structure and shuffle it later
            let tilesArray = Array.from({ length: totalTiles - 1 }, (_, i) => i + 1);
            let emptyIndex = totalTiles - 1; // Index of the empty space (0 to 8)

            function shuffleArray(array) {
                for (let i = array.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [array[i], array[j]] = [array[j], array[i]];
                }
            }

            function setupPuzzle() {
                // Start with tiles 1 through 8, and the empty spot (null)
                let tilesArray = Array.from({ length: 8 }, (_, i) => i + 1);
                tilesArray.push(null); // Empty spot is last

                // Simple shuffle to create the puzzle
                shuffleArray(tilesArray);

                // Ensure for testing purposes, we start with a potentially solvable state if possible, 
                // but for a lite implementation, we rely on shuffling.

                renderBoard();
                messageElement.textContent = "";
            }
                
                renderBoard();
                messageElement.textContent = "";
            }

            function renderBoard() {
                boardElement.innerHTML = '';
                tilesArray.forEach((value, index) => {
                    const tileDiv = document.createElement('div');
                    tileDiv.classList.add('tile');
                    tileDiv.dataset.index = index;

                    if (value === null) {
                        tileDiv.classList.add('empty');
                        tileDiv.textContent = '';
                    } else {
                        tileDiv.textContent = value;
                        tileDiv.addEventListener('click', () => handleTileClick(index));
                    }
                    boardElement.appendChild(tileDiv);
                });
            }

            function handleTileClick(clickedIndex) {
                const emptyIndex = tilesArray.indexOf(null);
                
                // Check if the clicked tile is adjacent (horizontally or vertically) to the empty space
                const clickedRow = Math.floor(clickedIndex / size);
                const clickedCol = clickedIndex % size;
                const emptyRow = Math.floor(emptyIndex / size);
                const emptyCol = emptyIndex % size;

                const isAdjacent = 
                    (Math.abs(clickedRow - emptyRow) === 1 && clickedCol === emptyCol) || // Vertical
                    (Math.abs(clickedCol - emptyCol) === 1 && clickedRow === emptyRow);   // Horizontal

                if (isAdjacent) {
                    // Swap the clicked tile with the empty space
                    tilesArray[emptyIndex] = tilesArray[clickedIndex];
                    tilesArray[clickedIndex] = null;
                    
                    renderBoard();
                    checkWinCondition();
                }
            }
            
            function checkWinCondition() {
                let solved = true;
                // Check 1 through 8 in order, and ensure the last spot (8th element, index 8) is null
                for (let i = 0; i < totalTiles - 1; i++) {
                    if (tilesArray[i] !== i + 1) {
                        solved = false;
                        break;
                    }
                }
                
                if (tilesArray[totalTiles - 1] !== null) {
                    solved = false; // Last spot must be empty
                }

                if (solved) {
                    messageElement.textContent = 'Congratulations! You solved the puzzle!';
                    // Disable clicks after winning (optional, but good practice)
                    document.querySelectorAll('.tile').forEach(tile => {
                        tile.removeEventListener('click', handleTileClick);
                    });
                }
            }
            
            // Initialize the game
            setupPuzzle();
        });
    </script>
</body>
</html>
