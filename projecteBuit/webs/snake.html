<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #2c3e50;
            color: white;
            font-family: Arial, sans-serif;
        }
        canvas {
            border: 5px solid #ecf0f1;
            background-color: #000;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        .controls {
            margin-top: 20px;
            display: flex;
            gap: 20px;
            align-items: center;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background-color: #27ae60;
            color: white;
            border: none;
            border-radius: 5px;
        }
        button:hover {
            background-color: #2ecc71;
        }
        #score {
            font-size: 24px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div id="score">Score: 0</div>
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <div class="controls">
        <button id="pauseBtn">Pause</button>
        <button id="restartBtn">Restart</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const pauseBtn = document.getElementById('pauseBtn');
        const restartBtn = document.getElementById('restartBtn');

        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        let score = 0;
        let dx = 0;
        let dy = 0;
        let snake = [{x: 10, y: 10}];
        let food = {x: 15, y: 15};
        let gameStarted = false;
        let paused = false;

        function main() {
            if (paused) return;

            if (gameStarted) {
                setTimeout(function onTick() {
                    clearCanvas();
                    drawFood();
                    advanceSnake();
                    drawSnake();
                    main();
                }, 100);
            } else {
                clearCanvas();
                drawSnake();
                drawFood();
                ctx.fillStyle = "white";
                ctx.font = "20px Arial";
                ctx.fillText("Press an arrow key to start", canvas.width/2 - 100, canvas.height/2);
            }
        }

        function clearCanvas() {
            ctx.fillStyle = "black";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function drawSnake() {
            ctx.fillStyle = "green";
            snake.forEach(part => {
                ctx.fillRect(part.x * gridSize, part.y * gridSize, gridSize - 2, gridSize - 2);
            });
        }

        function advanceSnake() {
            const head = {x: snake[0].x + dx, y: snake[0].y + dy};
            snake.unshift(head);
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreElement.innerHTML = `Score: ${score}`;
                createFood();
            } else {
                snake.pop();
            }

            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount ||
                snake.some(part => part.x === head.x && part.y === head.y)) {
                resetGame();
            }
        }

        function createFood() {
            food.x = Math.floor(Math.random() * tileCount);
            food.y = Math.floor(Math.random() * tileCount);
        }

        function drawFood() {
            ctx.fillStyle = "red";
            ctx.fillRect(food.x * gridSize, food.y * gridSize, gridSize - 2, gridSize - 2);
        }

        function resetGame() {
            score = 0;
            scoreElement.innerHTML = `Score: ${score}`;
            snake = [{x: 10, y: 10}];
            dx = 0;
            dy = 0;
            gameStarted = false;
            paused = false;
            pauseBtn.innerText = "Pause";
            clearCanvas();
            drawSnake();
            drawFood();
            ctx.fillStyle = "white";
            ctx.font = "20px Arial";
            ctx.fillText("Press an arrow key to start", canvas.width/2 - 100, canvas.height/2);
        }

        window.addEventListener('keydown', e => {
            if (!gameStarted && [37, 38, 39, 40].includes(e.keyCode)) {
                gameStarted = true;
                if (e.keyCode === 37) dx = -1;
                if (e.keyCode === 38) dy = -1;
                if (e.keyCode === 39) dx = 1;
                if (e.keyCode === 40) dy = 1;
                main();
            } else if (gameStarted) {
                switch (e.keyCode) {
                    case 37: if (dx !== 1) { dx = -1; dy = 0; } break;
                    case 38: if (dy !== 1) { dy = -1; dx = 0; } break;
                    case 39: if (dx !== -1) { dx = 1; dy = 0; } break;
                    case 40: if (dy !== -1) { dy = 1; dx = 0; } break;
                }
            }
        });

        pauseBtn.addEventListener('click', () => {
            paused = !paused;
            pauseBtn.innerText = paused ? "Resume" : "Pause";
        });

        restartBtn.addEventListener('click', resetGame);

        clearCanvas();
        drawSnake();
        drawFood();
        ctx.fillStyle = "white";
        ctx.font = "20px Arial";
        ctx.fillText("Press an arrow key to start", canvas.width/2 - 100, canvas.height/2);
    </script>
</body>
</html>
