<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Santronic 90S</title>
    <link rel="stylesheet" href="calculator.css">
</head>
<body>
    <div class="calculator" id="calculator">
        <div class="display-area">
            <div class="display" id="display">0</div>
        </div>

        <div class="controls-area">
            <div class="switch-container">
                <span class="switch-label on">ON</span>
                <label class="switch">
                    <input type="checkbox" id="powerSwitch" checked>
                    <span class="slider"></span>
                </label>
                <span class="switch-label off">OFF</span>
            </div>
            <span class="brand">SANTRONIC 90S</span>
            <div class="clear-buttons">
                <button class="btn-clear" data-action="clear-entry">CE</button>
                <button class="btn-clear" data-action="clear">C</button>
            </div>
        </div>

        <div class="keypad">
            <div class="key-row">
                <button class="btn-dark btn-special" data-action="percent">%</button>
                <button class="btn-light" data-action="number" data-value="7">7</button>
                <button class="btn-light" data-action="number" data-value="8">8</button>
                <button class="btn-light" data-action="number" data-value="9">9</button>
                <button class="btn-dark" data-action="operator" data-value="/">÷</button>
            </div>
            <div class="key-row">
                <button class="btn-dark btn-special" data-action="sqrt">√</button>
                <button class="btn-light" data-action="number" data-value="4">4</button>
                <button class="btn-light" data-action="number" data-value="5">5</button>
                <button class="btn-light" data-action="number" data-value="6">6</button>
                <button class="btn-dark" data-action="operator" data-value="*">×</button>
            </div>
            <div class="key-row">
                <button class="btn-dark btn-special" data-action="pi">π</button>
                <button class="btn-light" data-action="number" data-value="1">1</button>
                <button class="btn-light" data-action="number" data-value="2">2</button>
                <button class="btn-light" data-action="number" data-value="3">3</button>
                <button class="btn-dark" data-action="operator" data-value="+">+</button>
            </div>
            <div class="key-row">
                <button class="btn-dark btn-special" data-action="negate">+/-</button>
                <button class="btn-light" data-action="number" data-value="0">0</button>
                <button class="btn-light" data-action="decimal">.</button>
                <button class="btn-dark" data-action="operator" data-value="-">−</button>
                <button class="btn-dark btn-equals" data-action="equals">=</button>
            </div>
        </div>
    </div>
    <script src="calculator.js"></script>
</body>
</html>
