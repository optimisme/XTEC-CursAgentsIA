services:
  gemma4-12b-lora-train:
    build:
      context: .
      dockerfile: Dockerfile
    image: gemma4-12b-lora-train:local
    working_dir: /workspace/gemma4_tool_training
    entrypoint: []
    env_file:
      - ../docker/tokens.env
    environment:
      - HF_HOME=/root/.cache/huggingface
      - HUGGINGFACE_HUB_CACHE=/root/.cache/huggingface/hub
      - HF_HUB_DISABLE_XET=1
      - PYTORCH_ALLOC_CONF=expandable_segments:True
      - DATASET=${DATASET:-data/global_tool_sft_seed.jsonl}
      - OUTPUT_DIR=${OUTPUT_DIR:-outputs/gemma4-12b-global-tool-lora}
      - EPOCHS=${EPOCHS:-3}
      - BATCH_SIZE=${BATCH_SIZE:-1}
      - GRAD_ACCUM=${GRAD_ACCUM:-16}
      - LEARNING_RATE=${LEARNING_RATE:-2e-4}
      - MAX_SEQ_LENGTH=${MAX_SEQ_LENGTH:-2048}
      - MAX_STEPS=${MAX_STEPS:--1}
      - BASE_MODEL=${BASE_MODEL:-google/gemma-4-12B-it}
    volumes:
      - .:/workspace/gemma4_tool_training
      - vllm_hf_cache:/root/.cache/huggingface
    ipc: host
    shm_size: 16g
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command:
      - /bin/bash
      - -lc
      - |
        if [ -n "$${HUGGINGFACE:-}" ]; then
          export HF_TOKEN="$${HUGGINGFACE}"
          export HUGGING_FACE_HUB_TOKEN="$${HUGGINGFACE}"
        fi
        python3 preflight.py --dataset "$${DATASET:-data/global_tool_sft_seed.jsonl}"
        python3 train_lora.py \
          --base-model "$${BASE_MODEL:-google/gemma-4-12B-it}" \
          --dataset "$${DATASET:-data/global_tool_sft_seed.jsonl}" \
          --output-dir "$${OUTPUT_DIR:-outputs/gemma4-12b-global-tool-lora}" \
          --max-seq-length "$${MAX_SEQ_LENGTH:-2048}" \
          --epochs "$${EPOCHS:-3}" \
          --batch-size "$${BATCH_SIZE:-1}" \
          --grad-accum "$${GRAD_ACCUM:-16}" \
          --learning-rate "$${LEARNING_RATE:-2e-4}" \
          --max-steps "$${MAX_STEPS:--1}"

volumes:
  vllm_hf_cache:
    external: true
    name: xtec-hf-cache
