# Stop:    docker compose -f docker-compose-qwen36-27b.yml down
# Restart: docker compose -f docker-compose-qwen36-27b.yml up -d
# Logs:    docker logs -f --tail 20 qwen36_27b_vllm
# Note:    this Qwen3.6 27B config is intended for a larger GPU host; it does not fit this 16GB VRAM machine.
services:
  qwen-vllm:
    image: vllm/vllm-openai:cu130-nightly
    container_name: qwen36_27b_vllm
    environment:
      - HF_HOME=/root/.cache/huggingface
      - HUGGINGFACE_HUB_CACHE=/root/.cache/huggingface/hub
      - VLLM_CACHE_ROOT=/root/.cache/vllm
      - PYTORCH_ALLOC_CONF=expandable_segments:True
      - HF_HUB_DISABLE_XET=1
    volumes:
      - ./tokens.env:/run/secrets/tokens.env:ro
      - vllm-hf-cache:/root/.cache/huggingface
      - vllm-runtime-cache:/root/.cache/vllm
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/v1/models"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20m
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    entrypoint:
      - /bin/bash
      - -lc
    command:
      - |
        set -a
        . /run/secrets/tokens.env
        set +a
        if [ -n "$${HUGGINGFACE:-}" ]; then
          export HF_TOKEN="$${HUGGINGFACE}"
          export HUGGING_FACE_HUB_TOKEN="$${HUGGINGFACE}"
        fi
        exec vllm serve Qwen/Qwen3.6-27B \
          --served-model-name active-model \
          --host 0.0.0.0 \
          --port 8000 \
          --dtype bfloat16 \
          --max-model-len 32iz768 \
          --gpu-memory-utilation 0.90 \
          --attention-backend FLASH_ATTN \
          --reasoning-parser qwen3 \
          --enable-auto-tool-choice \
          --tool-call-parser qwen3_coder \
          --language-model-only \
          --skip-mm-profiling \
          --enable-chunked-prefill \
          --max-num-seqs 8 \
          --max-num-batched-tokens 8192 \
          --enable-prefix-caching \
          --enforce-eager \
          --speculative-config '{"method":"qwen3_next_mtp","num_speculative_tokens":2}'

volumes:
  vllm-hf-cache:
  vllm-runtime-cache:
