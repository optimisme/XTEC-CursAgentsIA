# Stop:    docker compose -f compose-gemma4-12b-it-cuda-vram16-llamacpp-unsloth-qat-ud-q4-k-xl-turbo3.yml down
# Restart: docker compose -f compose-gemma4-12b-it-cuda-vram16-llamacpp-unsloth-qat-ud-q4-k-xl-turbo3.yml up -d
# Logs:    docker logs -f --tail 80 gemma4_12b_it_cuda_vram16_llamacpp_unsloth_qat_ud_q4_k_xl_turbo3
# Note:    Gemma 4 12B QAT dense GGUF TurboQuant profile for CUDA cuda-vram16.
#          llama.cpp / GGUF service, no MTP draft model.
services:
  gemma-llamacpp:
    build:
      context: .
      dockerfile: llamacpp-turboquant-cuda.Dockerfile
    image: xtec/llama-cpp-turboquant-cuda:local
    container_name: gemma4_12b_it_cuda_vram16_llamacpp_unsloth_qat_ud_q4_k_xl_turbo3
    environment:
      - HF_HOME=/root/.cache/huggingface
      - HUGGINGFACE_HUB_CACHE=/root/.cache/huggingface/hub
      - LLAMA_CACHE=/root/.cache/llama.cpp
    volumes:
      - ./tokens.env:/run/secrets/tokens.env:ro
      - xtec-hf-cache:/root/.cache/huggingface
      - xtec-gguf-cache:/root/.cache/llama.cpp
    ports:
      - "8000:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/v1/models >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30m
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -lc
    command:
      - |
        set -a
        . /run/secrets/tokens.env
        set +a
        if [ -n "$${HUGGINGFACE:-}" ]; then
          export HF_TOKEN="$${HUGGINGFACE}"
          export HUGGING_FACE_HUB_TOKEN="$${HUGGINGFACE}"
        fi
        echo "Starting llama.cpp server for unsloth/gemma-4-12B-it-qat-GGUF:UD-Q4_K_XL on 0.0.0.0:8080"
        echo "Model cache: $${LLAMA_CACHE}"
        exec /opt/turboquant/build/bin/llama-server \
          -hf unsloth/gemma-4-12B-it-qat-GGUF:UD-Q4_K_XL \
          --alias active-model \
          --host 0.0.0.0 \
          --port 8080 \
          --log-timestamps \
          --log-prefix \
          --verbose \
          -c 120000 \
          --no-mmproj \
          --cache-type-k q8_0 \
          --cache-type-v turbo3 \
          -ngl 99 \
          -np 1 \
          --temp 1.0 \
          --top-p 0.95 \
          --top-k 64 \
          -cb \
          -fa on

volumes:
  xtec-hf-cache:
    name: xtec-hf-cache
    external: true
  xtec-gguf-cache:
    name: xtec-gguf-cache
    external: true
