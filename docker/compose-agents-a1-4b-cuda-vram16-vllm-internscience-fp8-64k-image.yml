# Stop:    docker compose -f compose-agents-a1-4b-cuda-vram16-vllm-internscience-fp8-64k-image.yml down
# Start:   docker compose -f compose-agents-a1-4b-cuda-vram16-vllm-internscience-fp8-64k-image.yml up -d
# Logs:    docker logs -f --tail 80 agents_a1_4b_cuda_vram16_vllm_internscience_fp8_64k_image
# Note:    Official W8A8 FP8 checkpoint tuned for a 16 GiB GPU: 64k maximum
#          context, chunked prefill, up to four sequences and one image per prompt.
services:
  agents-a1-vllm:
    image: vllm/vllm-openai:v0.23.0
    pull_policy: always
    container_name: agents_a1_4b_cuda_vram16_vllm_internscience_fp8_64k_image
    environment:
      - HF_HOME=/root/.cache/huggingface
      - HUGGINGFACE_HUB_CACHE=/root/.cache/huggingface/hub
      - VLLM_CACHE_ROOT=/root/.cache/vllm
      - PYTORCH_ALLOC_CONF=expandable_segments:True
      - HF_HUB_DISABLE_XET=1
      - HF_HUB_ENABLE_HF_TRANSFER=1
      - FLASHINFER_DISABLE_VERSION_CHECK=1
      - TORCH_MATMUL_PRECISION=high
    volumes:
      - ./tokens.env:/run/secrets/tokens.env:ro
      - xtec-agents-a1-4b-cuda-vram16-vllm-internscience-fp8-64k-image-hf-cache:/root/.cache/huggingface
      - xtec-agents-a1-4b-cuda-vram16-vllm-internscience-fp8-64k-image-vllm-cache:/root/.cache/vllm
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/v1/models"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 45m
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    entrypoint:
      - /bin/bash
      - -lc
    command:
      - |
        set -a
        . /run/secrets/tokens.env
        set +a
        if [ -n "$${HUGGINGFACE_ACCESS_TOKENS:-}" ]; then
          export HF_TOKEN="$${HUGGINGFACE_ACCESS_TOKENS}"
          export HUGGING_FACE_HUB_TOKEN="$${HUGGINGFACE_ACCESS_TOKENS}"
        fi
        exec vllm serve InternScience/Agents-A1-4B-FP8 \
          --served-model-name active-model \
          --host 0.0.0.0 \
          --port 8000 \
          --tensor-parallel-size 1 \
          --dtype auto \
          --gpu-memory-utilization 0.90 \
          --max-model-len 65536 \
          --max-num-seqs 4 \
          --max-num-batched-tokens 8192 \
          --override-generation-config '{"temperature":0.85,"top_p":0.95,"top_k":20,"min_p":0.0,"presence_penalty":1.1,"repetition_penalty":1.0}' \
          --enable-chunked-prefill \
          --enable-prefix-caching \
          --limit-mm-per-prompt '{"image":1,"video":0}' \
          --enable-auto-tool-choice \
          --tool-call-parser qwen3_coder \
          --reasoning-parser qwen3

volumes:
  xtec-agents-a1-4b-cuda-vram16-vllm-internscience-fp8-64k-image-hf-cache:
    name: xtec-agents-a1-4b-cuda-vram16-vllm-internscience-fp8-64k-image-hf-cache
    external: true
  xtec-agents-a1-4b-cuda-vram16-vllm-internscience-fp8-64k-image-vllm-cache:
    name: xtec-agents-a1-4b-cuda-vram16-vllm-internscience-fp8-64k-image-vllm-cache
    external: true
