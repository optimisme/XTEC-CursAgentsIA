# Stop:    docker compose -f compose-ornith10-9b-cuda-vram16-llamacpp-deepreinforce-gguf-q6k-image.yml down
# Restart: docker compose -f compose-ornith10-9b-cuda-vram16-llamacpp-deepreinforce-gguf-q6k-image.yml up -d
# Logs:    docker logs -f --tail 80 ornith10_9b_cuda_vram16_llamacpp_deepreinforce_gguf_q6k_image
# Note:    llama.cpp / GGUF service, not vLLM. Uses Ornith-1.0 9B Q6_K
#          with the Qwen3.5 9B mmproj from Unsloth.
services:
  ornith-llamacpp:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    pull_policy: always
    container_name: ornith10_9b_cuda_vram16_llamacpp_deepreinforce_gguf_q6k_image
    environment:
      - HF_HOME=/root/.cache/huggingface
      - HUGGINGFACE_HUB_CACHE=/root/.cache/huggingface/hub
      - LLAMA_CACHE=/root/.cache/llama.cpp
    volumes:
      - ./tokens.env:/run/secrets/tokens.env:ro
      - xtec-ornith10-9b-cuda-vram16-llamacpp-deepreinforce-gguf-q6k-image-hf-cache:/root/.cache/huggingface
      - xtec-ornith10-9b-cuda-vram16-llamacpp-deepreinforce-gguf-q6k-image-gguf-cache:/root/.cache/llama.cpp
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/v1/models >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20m
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -lc
    command:
      - |
        set -a
        . /run/secrets/tokens.env
        set +a
        if [ -n "$${HUGGINGFACE_ACCESS_TOKENS:-}" ]; then
          export HF_TOKEN="$${HUGGINGFACE_ACCESS_TOKENS}"
          export HUGGING_FACE_HUB_TOKEN="$${HUGGINGFACE_ACCESS_TOKENS}"
        fi
        echo "Starting llama.cpp server for deepreinforce-ai/Ornith-1.0-9B-GGUF:Q6_K on 0.0.0.0:8000"
        echo "Model cache: $${LLAMA_CACHE}"
        exec /app/llama-server \
          -hf deepreinforce-ai/Ornith-1.0-9B-GGUF:Q6_K \
          --mmproj-url https://huggingface.co/unsloth/Qwen3.5-9B-GGUF/resolve/main/mmproj-F16.gguf \
          --no-mmproj-offload \
          --alias active-model \
          --host 0.0.0.0 \
          --port 8000 \
          --log-timestamps \
          --log-prefix \
          --verbose \
          -c 65536 \
          -ngl 99 \
          -np 1 \
          --temp 0.6 \
          --top-p 0.95 \
          --top-k 20 \
          -cb \
          -fa on \
          -ctk q8_0 \
          -ctv q8_0 \
          --reasoning on \
          --reasoning-format deepseek \
          --chat-template-kwargs '{"enable_thinking":true}'

volumes:
  xtec-ornith10-9b-cuda-vram16-llamacpp-deepreinforce-gguf-q6k-image-hf-cache:
    name: xtec-ornith10-9b-cuda-vram16-llamacpp-deepreinforce-gguf-q6k-image-hf-cache
    external: true
  xtec-ornith10-9b-cuda-vram16-llamacpp-deepreinforce-gguf-q6k-image-gguf-cache:
    name: xtec-ornith10-9b-cuda-vram16-llamacpp-deepreinforce-gguf-q6k-image-gguf-cache
    external: true
