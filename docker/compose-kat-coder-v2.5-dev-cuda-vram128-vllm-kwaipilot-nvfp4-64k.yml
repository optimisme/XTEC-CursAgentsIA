# Stop:    docker compose -f compose-kat-coder-v2.5-dev-cuda-vram128-vllm-kwaipilot-nvfp4-64k.yml down
# Restart: docker compose -f compose-kat-coder-v2.5-dev-cuda-vram128-vllm-kwaipilot-nvfp4-64k.yml up -d
# Logs:    docker logs -f --tail 80 kat_coder_v2_5_dev_cuda_vram128_vllm_kwaipilot_nvfp4_64k
# Note:    Kwaipilot KAT-Coder-V2.5-Dev NVFP4 (W4A4 compressed-tensors) text-only vLLM profile.
#          Quantized by Lna-Lab, runs on single 128GB VRAM GPU with 64k context, thinking, and tool calling.
#          NVFP4 auto-detected; no --quantization flag needed.
services:
  kat-vllm:
    image: vllm/vllm-openai:v0.26.0
    pull_policy: always
    container_name: kat_coder_v2_5_dev_cuda_vram128_vllm_kwaipilot_nvfp4_64k
    environment:
      - HF_HOME=/root/.cache/huggingface
      - HUGGINGFACE_HUB_CACHE=/root/.cache/huggingface/hub
      - VLLM_CACHE_ROOT=/root/.cache/vllm
      - PYTORCH_ALLOC_CONF=expandable_segments:True
      - HF_XET_HIGH_PERFORMANCE=1
      - FLASHINFER_DISABLE_VERSION_CHECK=1
      - CUTE_DSL_ARCH=sm_121a
      - VLLM_ALLOW_LONG_MAX_MODEL_LEN=1
    volumes:
      - ./tokens.env:/run/secrets/tokens.env:ro
      - xtec-kat-coder-v2.5-dev-cuda-vram128-vllm-kwaipilot-nvfp4-64k-hf-cache:/root/.cache/huggingface
      - xtec-kat-coder-v2.5-dev-cuda-vram128-vllm-kwaipilot-nvfp4-64k-vllm-cache:/root/.cache/vllm
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/v1/models"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 30m
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    entrypoint:
      - /bin/bash
      - -lc
    command:
      - |
        set -a
        . /run/secrets/tokens.env
        set +a
        if [ -n "$${HUGGINGFACE_ACCESS_TOKENS:-}" ]; then
          export HF_TOKEN="$${HUGGINGFACE_ACCESS_TOKENS}"
          export HUGGING_FACE_HUB_TOKEN="$${HUGGINGFACE_ACCESS_TOKENS}"
        fi
        exec vllm serve sakamakismile/KAT-Coder-V2.5-Dev-NVFP4 \
          --served-model-name active-model \
          --host 0.0.0.0 \
          --port 8000 \
          --tensor-parallel-size 1 \
          --trust-remote-code \
          --dtype auto \
          --gpu-memory-utilization 0.85 \
          --max-model-len 65536 \
          --max-num-seqs 32 \
          --max-num-batched-tokens 65536 \
          --enable-chunked-prefill \
          --enable-prefix-caching \
          --enable-auto-tool-choice \
          --tool-call-parser qwen3_coder \
          --reasoning-parser qwen3 \
          --language-model-only

volumes:
  xtec-kat-coder-v2.5-dev-cuda-vram128-vllm-kwaipilot-nvfp4-64k-hf-cache:
    name: xtec-kat-coder-v2.5-dev-cuda-vram128-vllm-kwaipilot-nvfp4-64k-hf-cache
    external: true
  xtec-kat-coder-v2.5-dev-cuda-vram128-vllm-kwaipilot-nvfp4-64k-vllm-cache:
    name: xtec-kat-coder-v2.5-dev-cuda-vram128-vllm-kwaipilot-nvfp4-64k-vllm-cache
    external: true
