# Stop:    docker compose -f compose-vibethinker-3b-reasoning-cuda-vram16-vllm-weiboai-bf16.yml down
# Restart: docker compose -f compose-vibethinker-3b-reasoning-cuda-vram16-vllm-weiboai-bf16.yml up -d
# Logs:    docker logs -f --tail 80 vibethinker_3b_reasoning_cuda_vram16_vllm_weiboai_bf16
# Note:    VibeThinker-3B is a compact reasoning/code model based on Qwen2.5-Coder-3B.
#          The upstream model card warns it was not trained for tool-calling or autonomous agents.
#          Remote host port 8000 maps to the OpenAI-compatible vLLM API.
services:
  vibethinker-vllm:
    image: vllm/vllm-openai:latest
    pull_policy: missing
    container_name: vibethinker_3b_reasoning_cuda_vram16_vllm_weiboai_bf16
    environment:
      - HF_HOME=/root/.cache/huggingface
      - HUGGINGFACE_HUB_CACHE=/root/.cache/huggingface/hub
      - VLLM_CACHE_ROOT=/root/.cache/vllm
      - PYTORCH_ALLOC_CONF=expandable_segments:True
      - HF_HUB_DISABLE_XET=1
    volumes:
      - ./tokens.env:/run/secrets/tokens.env:ro
      - xtec-hf-cache:/root/.cache/huggingface
      - xtec-vllm-cache:/root/.cache/vllm
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/v1/models"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 20m
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    entrypoint:
      - /bin/bash
      - -lc
    command:
      - |
        set -a
        . /run/secrets/tokens.env
        set +a
        if [ -n "$${HUGGINGFACE:-}" ]; then
          export HF_TOKEN="$${HUGGINGFACE}"
          export HUGGING_FACE_HUB_TOKEN="$${HUGGINGFACE}"
        fi
        exec vllm serve WeiboAI/VibeThinker-3B \
          --served-model-name active-model \
          --host 0.0.0.0 \
          --port 8000 \
          --dtype bfloat16 \
          --max-model-len 8192 \
          --gpu-memory-utilization 0.85 \
          --max-num-seqs 2 \
          --max-num-batched-tokens 4096 \
          --enable-prefix-caching \
          --enable-chunked-prefill \
          --enforce-eager \
          --trust-remote-code \
          --generation-config auto \
          --override-generation-config '{"temperature": 1.0, "top_p": 0.95, "top_k": -1}' \
          --enable-auto-tool-choice \
          --tool-call-parser hermes

volumes:
  xtec-hf-cache:
    name: xtec-hf-cache
    external: true
  xtec-vllm-cache:
    name: xtec-vllm-cache
    external: true
