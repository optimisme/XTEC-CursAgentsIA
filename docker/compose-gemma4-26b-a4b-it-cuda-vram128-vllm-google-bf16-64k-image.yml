# Stop:    docker compose -f compose-gemma4-26b-a4b-it-cuda-vram128-vllm-google-bf16-64k-image.yml down
# Restart: docker compose -f compose-gemma4-26b-a4b-it-cuda-vram128-vllm-google-bf16-64k-image.yml up -d
# Logs:    docker logs -f --tail 80 gemma4_26b_a4b_it_cuda_vram128_vllm_google_bf16_64k_image
# Note:    Gemma 4 26B A4B BF16 profile for CUDA cuda-vram128 hosts.
#          This profile enables 64k context and one image per prompt.
#          Remote host port 8000 maps to the OpenAI-compatible vLLM API.
services:
  gemma-vllm:
    image: vllm/vllm-openai:v0.23.0
    pull_policy: missing
    container_name: gemma4_26b_a4b_it_cuda_vram128_vllm_google_bf16_64k_image
    environment:
      - HF_HOME=/root/.cache/huggingface
      - HUGGINGFACE_HUB_CACHE=/root/.cache/huggingface/hub
      - VLLM_CACHE_ROOT=/root/.cache/vllm
      - PYTORCH_ALLOC_CONF=expandable_segments:True
      - HF_HUB_DISABLE_XET=1
    volumes:
      - ./tokens.env:/run/secrets/tokens.env:ro
      - xtec-gemma4-26b-a4b-it-cuda-vram128-vllm-google-bf16-64k-image-hf-cache:/root/.cache/huggingface
      - xtec-gemma4-26b-a4b-it-cuda-vram128-vllm-google-bf16-64k-image-vllm-cache:/root/.cache/vllm
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/v1/models"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 30m
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    entrypoint:
      - /bin/bash
      - -lc
    command:
      - |
        set -a
        . /run/secrets/tokens.env
        set +a
        if [ -n "$${HUGGINGFACE_ACCESS_TOKENS:-}" ]; then
          export HF_TOKEN="$${HUGGINGFACE_ACCESS_TOKENS}"
          export HUGGING_FACE_HUB_TOKEN="$${HUGGINGFACE_ACCESS_TOKENS}"
        fi
        exec vllm serve google/gemma-4-26B-A4B-it \
          --served-model-name active-model \
          --host 0.0.0.0 \
          --port 8000 \
          --dtype bfloat16 \
          --max-model-len 65536 \
          --gpu-memory-utilization 0.90 \
          --kv-cache-dtype fp8 \
          --max-num-seqs 2 \
          --max-num-batched-tokens 4096 \
          --enable-prefix-caching \
          --enable-chunked-prefill \
          --trust-remote-code \
          --limit-mm-per-prompt '{"image": 1, "audio": 0}' \
          --generation-config vllm \
          --reasoning-parser gemma4 \
          --enable-auto-tool-choice \
          --tool-call-parser gemma4 \
          --chat-template examples/tool_chat_template_gemma4.jinja \
          --default-chat-template-kwargs '{"enable_thinking": true}'

volumes:
  xtec-gemma4-26b-a4b-it-cuda-vram128-vllm-google-bf16-64k-image-hf-cache:
    name: xtec-gemma4-26b-a4b-it-cuda-vram128-vllm-google-bf16-64k-image-hf-cache
    external: true
  xtec-gemma4-26b-a4b-it-cuda-vram128-vllm-google-bf16-64k-image-vllm-cache:
    name: xtec-gemma4-26b-a4b-it-cuda-vram128-vllm-google-bf16-64k-image-vllm-cache
    external: true
