# Stop:    docker compose -f compose-qwen35-9b-base-cuda-vram16-vllm-quanttrio-awq-legacy.yml down
# Restart: docker compose -f compose-qwen35-9b-base-cuda-vram16-vllm-quanttrio-awq-legacy.yml up -d
# Logs:    docker logs -f --tail 20 qwen35_9b_base_cuda_vram16_vllm_quanttrio_awq_legacy
# Note:    this service is published on host port 8000.
services:
  qwen-vllm:
    image: vllm/vllm-openai:cu130-nightly
    container_name: qwen35_9b_base_cuda_vram16_vllm_quanttrio_awq_legacy
    environment:
      - HF_HOME=/root/.cache/huggingface
      - HUGGINGFACE_HUB_CACHE=/root/.cache/huggingface/hub
      - VLLM_CACHE_ROOT=/root/.cache/vllm
      - PYTORCH_ALLOC_CONF=expandable_segments:True
      - HF_HUB_DISABLE_XET=1
    volumes:
      - ./tokens.env:/run/secrets/tokens.env:ro
      - xtec-hf-cache:/root/.cache/huggingface
      - xtec-vllm-cache:/root/.cache/vllm
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/v1/models"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20m
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    entrypoint:
      - /bin/bash
      - -lc
    command:
      - |
        set -a
        . /run/secrets/tokens.env
        set +a
        if [ -n "$${HUGGINGFACE:-}" ]; then
          export HF_TOKEN="$${HUGGINGFACE}"
          export HUGGING_FACE_HUB_TOKEN="$${HUGGINGFACE}"
        fi
        exec vllm serve QuantTrio/Qwen3.5-9B-AWQ \
          --served-model-name active-model \
          --host 0.0.0.0 \
          --port 8000 \
          --dtype bfloat16 \
          --max-model-len 32768 \
          --gpu-memory-utilization 0.85 \
          --quantization awq_marlin \
          --attention-backend FLASH_ATTN \
          --reasoning-parser qwen3 \
          --enable-auto-tool-choice \
          --tool-call-parser qwen3_coder \
          --language-model-only \
          --skip-mm-profiling \
          --enable-chunked-prefill \
          --max-num-seqs 2 \
          --max-num-batched-tokens 2048 \
          --enable-prefix-caching \
          --enforce-eager \
          --trust-remote-code

volumes:
  xtec-hf-cache:
    name: xtec-hf-cache
    external: true
  xtec-vllm-cache:
    name: xtec-vllm-cache
    external: true
