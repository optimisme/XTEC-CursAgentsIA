# Stop:    docker compose -f compose-gemma4-26b-a4b-it-cuda-vram16-llamacpp-google-qat-q4_0.yml down
# Restart: docker compose -f compose-gemma4-26b-a4b-it-cuda-vram16-llamacpp-google-qat-q4_0.yml up -d
# Logs:    docker logs -f --tail 80 gemma4_26b_a4b_it_cuda_vram16_llamacpp_google_qat_q4_0
# Note:    Gemma 4 26B A4B QAT Q4_0 GGUF profile for CUDA cuda-vram16.
#          llama.cpp / GGUF service, not vLLM. Uses partial GPU offload.
services:
  gemma-llamacpp:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    pull_policy: always
    container_name: gemma4_26b_a4b_it_cuda_vram16_llamacpp_google_qat_q4_0
    environment:
      - HF_HOME=/root/.cache/huggingface
      - HUGGINGFACE_HUB_CACHE=/root/.cache/huggingface/hub
      - LLAMA_CACHE=/root/.cache/llama.cpp
    volumes:
      - ./tokens.env:/run/secrets/tokens.env:ro
      - xtec-hf-cache:/root/.cache/huggingface
      - xtec-gguf-cache:/root/.cache/llama.cpp
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/v1/models >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30m
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -lc
    command:
      - |
        set -a
        . /run/secrets/tokens.env
        set +a
        if [ -n "$${HUGGINGFACE:-}" ]; then
          export HF_TOKEN="$${HUGGINGFACE}"
          export HUGGING_FACE_HUB_TOKEN="$${HUGGINGFACE}"
        fi
        echo "Starting llama.cpp server for google/gemma-4-26B-A4B-it-qat-q4_0-gguf on 0.0.0.0:8000"
        echo "Model cache: $${LLAMA_CACHE}"
        exec /app/llama-server \
          -hf google/gemma-4-26B-A4B-it-qat-q4_0-gguf \
          -hff gemma-4-26B_q4_0-it.gguf \
          --alias active-model \
          --host 0.0.0.0 \
          --port 8000 \
          --log-timestamps \
          --log-prefix \
          --verbose \
          -c 32768 \
          -ngl 24 \
          -np 1 \
          --temp 1.0 \
          --top-p 0.95 \
          --top-k 64 \
          -cb \
          -fa on \
          -ctk q8_0 \
          -ctv q8_0

volumes:
  xtec-hf-cache:
    name: xtec-hf-cache
    external: true
  xtec-gguf-cache:
    name: xtec-gguf-cache
    external: true
