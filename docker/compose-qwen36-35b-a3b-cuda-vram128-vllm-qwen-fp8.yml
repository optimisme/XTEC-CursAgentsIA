# Stop:    docker compose -f compose-qwen36-35b-a3b-cuda-vram128-vllm-qwen-fp8.yml down
# Restart: docker compose -f compose-qwen36-35b-a3b-cuda-vram128-vllm-qwen-fp8.yml up -d
# Logs:    docker logs -f --tail 80 qwen36_35b_a3b_cuda_vram128_vllm_qwen_fp8
# Note:    Official Qwen FP8 checkpoint for cuda-vram128 testing.
services:
  qwen-vllm:
    image: vllm/vllm-openai:v0.26.0
    pull_policy: always
    container_name: qwen36_35b_a3b_cuda_vram128_vllm_qwen_fp8
    environment:
      - HF_HOME=/root/.cache/huggingface
      - HUGGINGFACE_HUB_CACHE=/root/.cache/huggingface/hub
      - VLLM_CACHE_ROOT=/root/.cache/vllm
      - PYTORCH_ALLOC_CONF=expandable_segments:True
      - HF_HUB_DISABLE_XET=1
      - FLASHINFER_DISABLE_VERSION_CHECK=1
      - CUTE_DSL_ARCH=sm_121a
    volumes:
      - ./tokens.env:/run/secrets/tokens.env:ro
      - xtec-qwen36-35b-a3b-cuda-vram128-vllm-qwen-fp8-hf-cache:/root/.cache/huggingface
      - xtec-qwen36-35b-a3b-cuda-vram128-vllm-qwen-fp8-vllm-cache:/root/.cache/vllm
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/v1/models"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 30m
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    entrypoint:
      - /bin/bash
      - -lc
    command:
      - |
        set -a
        . /run/secrets/tokens.env
        set +a
        if [ -n "$${HUGGINGFACE_ACCESS_TOKENS:-}" ]; then
          export HF_TOKEN="$${HUGGINGFACE_ACCESS_TOKENS}"
          export HUGGING_FACE_HUB_TOKEN="$${HUGGINGFACE_ACCESS_TOKENS}"
        fi
        exec vllm serve Qwen/Qwen3.6-35B-A3B-FP8 \
          --served-model-name active-model \
          --host 0.0.0.0 \
          --port 8000 \
          --tensor-parallel-size 1 \
          --trust-remote-code \
          --dtype auto \
          --kv-cache-dtype fp8 \
          --attention-backend flashinfer \
          --gpu-memory-utilization 0.85 \
          --max-model-len 32768 \
          --max-num-seqs 8 \
          --max-num-batched-tokens 8192 \
          --enable-chunked-prefill \
          --async-scheduling \
          --enable-prefix-caching \
          --prefix-match-unit 16 \
          --reasoning-parser qwen3 \
          --tool-call-parser qwen3_xml \
          --enable-auto-tool-choice

volumes:
  xtec-qwen36-35b-a3b-cuda-vram128-vllm-qwen-fp8-hf-cache:
    name: xtec-qwen36-35b-a3b-cuda-vram128-vllm-qwen-fp8-hf-cache
    external: true
  xtec-qwen36-35b-a3b-cuda-vram128-vllm-qwen-fp8-vllm-cache:
    name: xtec-qwen36-35b-a3b-cuda-vram128-vllm-qwen-fp8-vllm-cache
    external: true
