# Stop:    docker compose -f docker-compose-gemma4-12b-q8-llamacpp.yml down
# Restart: docker compose -f docker-compose-gemma4-12b-q8-llamacpp.yml up -d
# Logs:    docker logs -f --tail 20 gemma4_12b_q8_llamacpp
# Note:    Gemma 4 12B Q8 GGUF path for RTX 4060 Ti 16GB. Keeps OpenAI model alias as active-model.
services:
  gemma-llamacpp:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: gemma4_12b_q8_llamacpp
    volumes:
      - llama-cpp-cache:/root/.cache/llama.cpp
      - llama-hf-cache:/root/.cache/huggingface
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/v1/models >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20m
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    command:
      - -hf
      - unsloth/gemma-4-12b-it-GGUF:Q8_0
      - -ngl
      - "99"
      - -c
      - "32768"
      - --alias
      - active-model
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --jinja
      - --reasoning
      - "off"

volumes:
  llama-cpp-cache:
  llama-hf-cache:
