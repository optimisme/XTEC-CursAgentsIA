# Stop:    docker compose -f docker-compose-qwen3-14b.yml down
# Restart: docker compose -f docker-compose-qwen3-14b.yml up -d
# Logs:    docker logs -f --tail 20 qwen3_14b_awq_vllm
# Note:    stop any other vLLM service using port 8000 before starting this one.
services:
  qwen-vllm:
    image: vllm/vllm-openai:latest
    container_name: qwen3_14b_awq_vllm
    environment:
      - HF_HOME=/root/.cache/huggingface
      - HUGGINGFACE_HUB_CACHE=/root/.cache/huggingface/hub
      - VLLM_CACHE_ROOT=/root/.cache/vllm
      - PYTORCH_ALLOC_CONF=expandable_segments:True
      - HF_HUB_DISABLE_XET=1
    volumes:
      - ./tokens.env:/run/secrets/tokens.env:ro
      - vllm-hf-cache:/root/.cache/huggingface
      - vllm-runtime-cache:/root/.cache/vllm
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/v1/models"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20m
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    entrypoint:
      - /bin/bash
      - -lc
    command:
      - |
        set -a
        . /run/secrets/tokens.env
        set +a
        if [ -n "$${HUGGINGFACE:-}" ]; then
          export HF_TOKEN="$${HUGGINGFACE}"
          export HUGGING_FACE_HUB_TOKEN="$${HUGGINGFACE}"
        fi
        exec vllm serve Qwen/Qwen3-14B-AWQ \
          --served-model-name qwen3-14b-local \
          --host 0.0.0.0 \
          --port 8000 \
          --max-model-len 32768 \
          --hf-overrides '{"rope_scaling":{"rope_type":"yarn","factor":2.0,"original_max_position_embeddings":32768}}' \
          --gpu-memory-utilization 0.85 \
          --cpu-offload-gb 2 \
          --quantization awq_marlin \
          --kv-cache-dtype fp8 \
          --max-num-seqs 2 \
          --max-num-batched-tokens 1024 \
          --no-enable-prefix-caching \
          --enable-chunked-prefill \
          --enforce-eager \
          --trust-remote-code \
          --reasoning-parser qwen3 \
          --enable-auto-tool-choice \
          --tool-call-parser hermes

volumes:
  vllm-hf-cache:
  vllm-runtime-cache:
