# Local:   DIFFUSIONGEMMA_HOST_PORT=8002 docker compose -f compose-diffusiongemma-26b-a4b-it-cuda-vram128-vllm-google-bf16.yml up -d
# Stop:    docker compose -f compose-diffusiongemma-26b-a4b-it-cuda-vram128-vllm-google-bf16.yml down
# Restart: docker compose -f compose-diffusiongemma-26b-a4b-it-cuda-vram128-vllm-google-bf16.yml up -d
# Logs:    docker logs -f --tail 80 diffusiongemma_26b_a4b_it_cuda_vram128_vllm_google_bf16
# Note:    DiffusionGemma is currently published as a 26B/4B-active Gemma 4 MoE model,
#          not as a 12B checkpoint. Remote service listens on port 8000.
services:
  diffusiongemma-vllm:
    image: vllm/vllm-openai:gemma
    pull_policy: always
    container_name: diffusiongemma_26b_a4b_it_cuda_vram128_vllm_google_bf16
    environment:
      - HF_HOME=/root/.cache/huggingface
      - HUGGINGFACE_HUB_CACHE=/root/.cache/huggingface/hub
      - VLLM_CACHE_ROOT=/root/.cache/vllm
      - PYTORCH_ALLOC_CONF=expandable_segments:True
      - HF_HUB_DISABLE_XET=1
    volumes:
      - ./tokens.env:/run/secrets/tokens.env:ro
      - xtec-hf-cache:/root/.cache/huggingface
      - xtec-vllm-cache:/root/.cache/vllm
    ports:
      - "${DIFFUSIONGEMMA_HOST_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/v1/models"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 30m
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    entrypoint:
      - /bin/bash
      - -lc
    command:
      - |
        set -a
        . /run/secrets/tokens.env
        set +a
        if [ -n "$${HUGGINGFACE:-}" ]; then
          export HF_TOKEN="$${HUGGINGFACE}"
          export HUGGING_FACE_HUB_TOKEN="$${HUGGINGFACE}"
        fi
        exec vllm serve google/diffusiongemma-26B-A4B-it \
          --served-model-name active-model \
          --host 0.0.0.0 \
          --port 8000 \
          --dtype bfloat16 \
          --max-model-len 65536 \
          --max-num-seqs 4 \
          --gpu-memory-utilization 0.85 \
          --kv-cache-dtype fp8 \
          --max-num-batched-tokens 4096 \
          --attention-backend TRITON_ATTN \
          --generation-config vllm \
          --hf-overrides '{"diffusion_sampler": "entropy_bound", "diffusion_entropy_bound": 0.1}' \
          --diffusion-config '{"canvas_length": 256}' \
          --enable-chunked-prefill \
          --trust-remote-code \
          --limit-mm-per-prompt '{"image": 0, "video": 0}' \
          --reasoning-parser gemma4 \
          --enable-auto-tool-choice \
          --tool-call-parser gemma4 \
          --chat-template examples/tool_chat_template_gemma4.jinja \
          --default-chat-template-kwargs '{"enable_thinking": true}'

volumes:
  xtec-hf-cache:
    name: xtec-hf-cache
    external: true
  xtec-vllm-cache:
    name: xtec-vllm-cache
    external: true
