# Stop:    docker compose -f compose-gemma4-e4b-it-cuda-vram128-vllm-google-bf16.yml down
# Restart: docker compose -f compose-gemma4-e4b-it-cuda-vram128-vllm-google-bf16.yml up -d
# Logs:    docker logs -f --tail 20 gemma4_e4b_it_cuda_vram128_vllm_google_bf16
# Note:    optimized for CUDA cuda-vram128 hosts. Remote service listens on port 8000.
services:
  gemma-vllm:
    image: vllm/vllm-openai:gemma4-cu130
    container_name: gemma4_e4b_it_cuda_vram128_vllm_google_bf16
    environment:
      - HF_HOME=/root/.cache/huggingface
      - HUGGINGFACE_HUB_CACHE=/root/.cache/huggingface/hub
      - VLLM_CACHE_ROOT=/root/.cache/vllm
      - PYTORCH_ALLOC_CONF=expandable_segments:True
      - HF_HUB_DISABLE_XET=1
    volumes:
      - ./tokens.env:/run/secrets/tokens.env:ro
      - xtec-hf-cache:/root/.cache/huggingface
      - xtec-vllm-cache:/root/.cache/vllm
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/v1/models"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20m
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    entrypoint:
      - /bin/bash
      - -lc
    command:
      - |
        set -a
        . /run/secrets/tokens.env
        set +a
        if [ -n "$${HUGGINGFACE:-}" ]; then
          export HF_TOKEN="$${HUGGINGFACE}"
          export HUGGING_FACE_HUB_TOKEN="$${HUGGINGFACE}"
        fi
        exec vllm serve google/gemma-4-E4B-it \
          --served-model-name active-model \
          --host 0.0.0.0 \
          --port 8000 \
          --dtype bfloat16 \
          --max-model-len 32768 \
          --gpu-memory-utilization 0.90 \
          --kv-cache-dtype fp8 \
          --max-num-seqs 8 \
          --max-num-batched-tokens 4096 \
          --enable-prefix-caching \
          --enable-chunked-prefill \
          --trust-remote-code \
          --limit-mm-per-prompt '{"image": 0, "audio": 0}' \
          --generation-config vllm \
          --reasoning-parser gemma4 \
          --enable-auto-tool-choice \
          --tool-call-parser gemma4 \
          --chat-template examples/tool_chat_template_gemma4.jinja \
          --default-chat-template-kwargs '{"enable_thinking": true}'

volumes:
  xtec-hf-cache:
    name: xtec-hf-cache
    external: true
  xtec-vllm-cache:
    name: xtec-vllm-cache
    external: true
