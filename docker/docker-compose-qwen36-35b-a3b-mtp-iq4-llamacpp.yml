# Stop:    docker compose -f docker-compose-qwen36-35b-a3b-mtp-iq4-llamacpp.yml down
# Restart: docker compose -f docker-compose-qwen36-35b-a3b-mtp-iq4-llamacpp.yml up -d
# Logs:    docker logs -f --tail 80 qwen36_35b_a3b_mtp_iq4_llamacpp
# Note:    llama.cpp / GGUF service, not vLLM. RTX 4060 Ti 16 GB with partial GPU offload.
services:
  qwen-llamacpp:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    pull_policy: always
    container_name: qwen36_35b_a3b_mtp_iq4_llamacpp
    environment:
      - HF_HOME=/root/.cache/huggingface
      - HUGGINGFACE_HUB_CACHE=/root/.cache/huggingface/hub
      - LLAMA_CACHE=/root/.cache/llama.cpp
    volumes:
      - ./tokens.env:/run/secrets/tokens.env:ro
      - xtec-hf-cache:/root/.cache/huggingface
      - xtec-gguf-cache:/root/.cache/llama.cpp
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/v1/models >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30m
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -lc
    command:
      - |
        set -a
        . /run/secrets/tokens.env
        set +a
        if [ -n "$${HUGGINGFACE:-}" ]; then
          export HF_TOKEN="$${HUGGINGFACE}"
          export HUGGING_FACE_HUB_TOKEN="$${HUGGINGFACE}"
        fi
        echo "Starting llama.cpp server for localweights/Qwen3.6-35B-A3B-MTP-IQ4_XS-GGUF:IQ4_XS on 0.0.0.0:8000"
        echo "Model cache: $${LLAMA_CACHE}"
        exec /app/llama-server \
          -hf localweights/Qwen3.6-35B-A3B-MTP-IQ4_XS-GGUF:IQ4_XS \
          --alias active-model \
          --host 0.0.0.0 \
          --port 8000 \
          --log-timestamps \
          --log-prefix \
          --verbose \
          -c 65536 \
          -ngl 24 \
          -np 1 \
          -cb \
          -fa on \
          -ctk q8_0 \
          -ctv q8_0

volumes:
  xtec-hf-cache:
    name: xtec-hf-cache
    external: true
  xtec-gguf-cache:
    name: xtec-gguf-cache
    external: true
