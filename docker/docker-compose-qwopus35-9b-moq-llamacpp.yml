# Stop:    docker compose -f docker-compose-qwopus35-9b-moq-llamacpp.yml down
# Restart: docker compose -f docker-compose-qwopus35-9b-moq-llamacpp.yml up -d
# Logs:    docker logs -f --tail 20 qwopus35_9b_moq_llamacpp
# Note:    Qwopus3.5 9B Coder MoQ GGUF via llama.cpp for RTX 4060 Ti 16GB.
#          Uses MoQ-4.2 by default: 4.89 GB GGUF, a practical first test before larger MoQ quants.
#          Download first:
#          mkdir -p models/qwopus35-9b-moq
#          curl -L -C - -o models/qwopus35-9b-moq/MoQ-4.2.gguf \
#            https://huggingface.co/w-ahmad/Qwopus3.5-9B-Coder-MTP-GGUF-MoQ/resolve/main/MoQ-Quants/MoQ-4.2.gguf
services:
  qwopus-llamacpp:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: qwopus35_9b_moq_llamacpp
    volumes:
      - ../models/qwopus35-9b-moq:/models/qwopus35-9b-moq:ro,z
      - llama-cpp-cache:/root/.cache/llama.cpp
      - llama-hf-cache:/root/.cache/huggingface
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/v1/models >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20m
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    command:
      - -m
      - /models/qwopus35-9b-moq/MoQ-4.2.gguf
      - -ngl
      - "99"
      - -c
      - "32768"
      - --alias
      - active-model
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --jinja
      - --reasoning
      - "off"
      - --reasoning-format
      - deepseek

volumes:
  llama-cpp-cache:
  llama-hf-cache:
