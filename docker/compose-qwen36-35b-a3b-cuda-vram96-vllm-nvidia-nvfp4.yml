# Stop:    docker compose -f compose-qwen36-35b-a3b-cuda-vram96-vllm-nvidia-nvfp4.yml down
# Restart: docker compose -f compose-qwen36-35b-a3b-cuda-vram96-vllm-nvidia-nvfp4.yml up -d
# Logs:    docker logs -f --tail 80 qwen36_35b_a3b_cuda_vram96_vllm_nvidia_nvfp4
# Note:    Qwen3.6 35B A3B NVIDIA ModelOpt NVFP4 checkpoint for CUDA cuda-vram96 hosts.
#          Remote host port 8000 maps to the OpenAI-compatible vLLM API.
services:
  qwen-vllm:
    image: vllm/vllm-openai@sha256:4cebac8c03f2cd9f5fabe72ac7c2a0b3aaa8450ef8f0e47429425fd1bfb83d42
    pull_policy: always
    container_name: qwen36_35b_a3b_cuda_vram96_vllm_nvidia_nvfp4
    environment:
      - HF_HOME=/root/.cache/huggingface
      - HUGGINGFACE_HUB_CACHE=/root/.cache/huggingface/hub
      - VLLM_CACHE_ROOT=/root/.cache/vllm
      - PYTORCH_ALLOC_CONF=expandable_segments:True
      - HF_HUB_DISABLE_XET=1
      - FLASHINFER_DISABLE_VERSION_CHECK=1
      - CUTE_DSL_ARCH=sm_121a
    volumes:
      - ./tokens.env:/run/secrets/tokens.env:ro
      - xtec-hf-cache:/root/.cache/huggingface
      - xtec-vllm-cache:/root/.cache/vllm
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/v1/models"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 30m
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    entrypoint:
      - /bin/bash
      - -lc
    command:
      - |
        set -a
        . /run/secrets/tokens.env
        set +a
        if [ -n "$${HUGGINGFACE:-}" ]; then
          export HF_TOKEN="$${HUGGINGFACE}"
          export HUGGING_FACE_HUB_TOKEN="$${HUGGINGFACE}"
        fi
        exec vllm serve nvidia/Qwen3.6-35B-A3B-NVFP4 \
          --served-model-name active-model \
          --host 0.0.0.0 \
          --port 8000 \
          --tensor-parallel-size 1 \
          --trust-remote-code \
          --dtype auto \
          --quantization modelopt \
          --kv-cache-dtype fp8 \
          --attention-backend flashinfer \
          --gpu-memory-utilization 0.85 \
          --max-model-len 32768 \
          --max-num-seqs 8 \
          --max-num-batched-tokens 8192 \
          --enable-chunked-prefill \
          --async-scheduling \
          --enable-prefix-caching \
          --reasoning-parser qwen3 \
          --tool-call-parser qwen3_xml \
          --enable-auto-tool-choice

volumes:
  xtec-hf-cache:
    name: xtec-hf-cache
    external: true
  xtec-vllm-cache:
    name: xtec-vllm-cache
    external: true
