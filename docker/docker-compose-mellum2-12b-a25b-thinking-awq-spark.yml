# Stop:    docker compose -f docker-compose-mellum2-12b-a25b-thinking-awq-spark.yml down
# Restart: docker compose -f docker-compose-mellum2-12b-a25b-thinking-awq-spark.yml up -d
# Logs:    docker logs -f --tail 20 mellum2_12b_a25b_thinking_awq_spark_vllm
# Note:    test build for the local compressed-tensors/AWQ export on NVIDIA Spark.
#          Current Mellum2 AWQ export is partial: attention is W4, MoE experts remain BF16.
services:
  mellum-awq-vllm:
    image: vllm/vllm-openai:cu130-nightly
    container_name: mellum2_12b_a25b_thinking_awq_spark_vllm
    environment:
      - HF_HOME=/root/.cache/huggingface
      - HUGGINGFACE_HUB_CACHE=/root/.cache/huggingface/hub
      - VLLM_CACHE_ROOT=/root/.cache/vllm
      - PYTORCH_ALLOC_CONF=expandable_segments:True
      - HF_HUB_DISABLE_XET=1
    volumes:
      - ./tokens.env:/run/secrets/tokens.env:ro
      - ../quantized/Mellum2-12B-A2.5B-Thinking-AWQ-W4A16:/models/Mellum2-12B-A2.5B-Thinking-AWQ-W4A16:ro
      - vllm-hf-cache:/root/.cache/huggingface
      - vllm-runtime-cache:/root/.cache/vllm
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/v1/models"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30m
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: "no"
    entrypoint:
      - /bin/bash
      - -lc
    command:
      - |
        set -e
        set -a
        . /run/secrets/tokens.env
        set +a
        if [ -n "$${HUGGINGFACE:-}" ]; then
          export HF_TOKEN="$${HUGGINGFACE}"
          export HUGGING_FACE_HUB_TOKEN="$${HUGGINGFACE}"
        fi
        if ! command -v git >/dev/null 2>&1; then
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates
          rm -rf /var/lib/apt/lists/*
        fi
        python3 -m pip install --no-cache-dir --upgrade \
          'git+https://github.com/huggingface/transformers.git'
        exec vllm serve /models/Mellum2-12B-A2.5B-Thinking-AWQ-W4A16 \
          --served-model-name active-model \
          --host 0.0.0.0 \
          --port 8000 \
          --dtype bfloat16 \
          --max-model-len 65536 \
          --gpu-memory-utilization 0.90 \
          --kv-cache-dtype fp8 \
          --max-num-seqs 4 \
          --max-num-batched-tokens 4096 \
          --enable-prefix-caching \
          --enable-chunked-prefill \
          --enforce-eager \
          --trust-remote-code \
          --reasoning-parser qwen3 \
          --enable-auto-tool-choice \
          --tool-call-parser hermes

volumes:
  vllm-hf-cache:
  vllm-runtime-cache:
