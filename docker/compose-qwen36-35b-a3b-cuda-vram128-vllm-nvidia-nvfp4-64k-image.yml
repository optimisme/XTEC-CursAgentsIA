# Stop:    docker compose -f compose-qwen36-35b-a3b-cuda-vram128-vllm-nvidia-nvfp4-64k-image.yml down
# Start:   docker compose -f compose-qwen36-35b-a3b-cuda-vram128-vllm-nvidia-nvfp4-64k-image.yml up -d
# Logs:    docker logs -f --tail 80 qwen36_35b_a3b_cuda_vram128_vllm_nvidia_nvfp4_64k_image
# Note:    NVIDIA Qwen3.6 35B A3B NVFP4 profile using vLLM 0.26.0
#          with FlashInfer B12X MoE and FlashInfer CUTLASS linear backends.
services:
  qwen-vllm:
    image: vllm/vllm-openai:v0.26.0
    pull_policy: always
    container_name: qwen36_35b_a3b_cuda_vram128_vllm_nvidia_nvfp4_64k_image
    environment:
      - HF_HOME=/root/.cache/huggingface
      - HUGGINGFACE_HUB_CACHE=/root/.cache/huggingface/hub
      - VLLM_CACHE_ROOT=/root/.cache/vllm
      - PYTORCH_ALLOC_CONF=expandable_segments:True
      - HF_HUB_DISABLE_XET=1
      - HF_HUB_ENABLE_HF_TRANSFER=1
      - FLASHINFER_DISABLE_VERSION_CHECK=1
      - CUTE_DSL_ARCH=sm_121a
      - VLLM_ALLOW_LONG_MAX_MODEL_LEN=1
      - TORCH_MATMUL_PRECISION=high
    volumes:
      - ./tokens.env:/run/secrets/tokens.env:ro
      - xtec-qwen36-35b-a3b-cuda-vram128-vllm-nvidia-nvfp4-64k-image-hf-cache:/root/.cache/huggingface
      - xtec-qwen36-35b-a3b-cuda-vram128-vllm-nvidia-nvfp4-64k-image-vllm-cache:/root/.cache/vllm
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/v1/models"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 45m
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    entrypoint:
      - /bin/bash
      - -lc
    command:
      - |
        set -a
        . /run/secrets/tokens.env
        set +a
        if [ -n "$${HUGGINGFACE_ACCESS_TOKENS:-}" ]; then
          export HF_TOKEN="$${HUGGINGFACE_ACCESS_TOKENS}"
          export HUGGING_FACE_HUB_TOKEN="$${HUGGINGFACE_ACCESS_TOKENS}"
        fi
        exec vllm serve nvidia/Qwen3.6-35B-A3B-NVFP4 \
          --served-model-name active-model \
          --host 0.0.0.0 \
          --port 8000 \
          --tensor-parallel-size 1 \
          --trust-remote-code \
          --dtype auto \
          --quantization modelopt \
          --kv-cache-dtype fp8 \
          --attention-backend flashinfer \
          --moe-backend flashinfer_b12x \
          --linear-backend flashinfer_cutlass \
          --gpu-memory-utilization 0.80 \
          --max-model-len 65536 \
          --max-num-seqs 32 \
          --max-num-batched-tokens 65536 \
          --enable-chunked-prefill \
          --enable-prefix-caching \
          --prefix-match-unit 16 \
          --limit-mm-per-prompt '{"image":4,"video":0}' \
          --enable-auto-tool-choice \
          --tool-call-parser qwen3_xml \
          --reasoning-parser qwen3

volumes:
  xtec-qwen36-35b-a3b-cuda-vram128-vllm-nvidia-nvfp4-64k-image-hf-cache:
    name: xtec-qwen36-35b-a3b-cuda-vram128-vllm-nvidia-nvfp4-64k-image-hf-cache
    external: true
  xtec-qwen36-35b-a3b-cuda-vram128-vllm-nvidia-nvfp4-64k-image-vllm-cache:
    name: xtec-qwen36-35b-a3b-cuda-vram128-vllm-nvidia-nvfp4-64k-image-vllm-cache
    external: true
