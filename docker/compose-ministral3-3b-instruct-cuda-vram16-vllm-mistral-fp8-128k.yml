# Stop:    docker compose -f compose-ministral3-3b-instruct-cuda-vram16-vllm-mistral-fp8-128k.yml down
# Restart: docker compose -f compose-ministral3-3b-instruct-cuda-vram16-vllm-mistral-fp8-128k.yml up -d
# Logs:    docker logs -f --tail 80 ministral3_3b_instruct_cuda_vram16_vllm_mistral_fp8_128k
# Note:    Ministral 3 3B Instruct FP8 vLLM profile for CUDA cuda-vram128 hosts.
#          Remote host port 8000 maps to the OpenAI-compatible vLLM API.
services:
  ministral-vllm:
    image: vllm/vllm-openai:v0.23.0
    pull_policy: missing
    container_name: ministral3_3b_instruct_cuda_vram16_vllm_mistral_fp8_128k
    environment:
      - HF_HOME=/root/.cache/huggingface
      - HUGGINGFACE_HUB_CACHE=/root/.cache/huggingface/hub
      - VLLM_CACHE_ROOT=/root/.cache/vllm
      - PYTORCH_ALLOC_CONF=expandable_segments:True
      - HF_HUB_DISABLE_XET=1
      - FLASHINFER_DISABLE_VERSION_CHECK=1
      - CUTE_DSL_ARCH=sm_121a
    volumes:
      - ./tokens.env:/run/secrets/tokens.env:ro
      - xtec-hf-cache:/root/.cache/huggingface
      - xtec-vllm-cache:/root/.cache/vllm
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/v1/models"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 30m
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    entrypoint:
      - /bin/bash
      - -lc
    command:
      - |
        set -a
        . /run/secrets/tokens.env
        set +a
        if [ -n "$${HUGGINGFACE_ACCESS_TOKENS:-}" ]; then
          export HF_TOKEN="$${HUGGINGFACE_ACCESS_TOKENS}"
          export HUGGING_FACE_HUB_TOKEN="$${HUGGINGFACE_ACCESS_TOKENS}"
        fi
        exec vllm serve mistralai/Ministral-3-3B-Instruct-2512 \
          --served-model-name active-model \
          --host 0.0.0.0 \
          --port 8000 \
          --tensor-parallel-size 1 \
          --trust-remote-code \
          --tokenizer-mode mistral \
          --config-format mistral \
          --load-format mistral \
          --dtype auto \
          --gpu-memory-utilization 0.85 \
          --max-model-len 131072 \
          --max-num-seqs 8 \
          --max-num-batched-tokens 16384 \
          --enable-chunked-prefill \
          --async-scheduling \
          --enable-prefix-caching \
          --language-model-only \
          --tool-call-parser mistral \
          --enable-auto-tool-choice

volumes:
  xtec-hf-cache:
    name: xtec-hf-cache
    external: true
  xtec-vllm-cache:
    name: xtec-vllm-cache
    external: true
