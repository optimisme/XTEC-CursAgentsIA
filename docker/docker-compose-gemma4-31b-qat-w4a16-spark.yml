# Stop:    docker compose -f docker-compose-gemma4-31b-qat-w4a16-spark.yml down
# Restart: docker compose -f docker-compose-gemma4-31b-qat-w4a16-spark.yml up -d
# Logs:    docker logs -f --tail 80 gemma4_31b_qat_w4a16_spark_vllm
# Note:    Gemma 4 31B QAT compressed-tensors checkpoint for NVIDIA Spark / GB10 hosts.
#          Remote host port 8000 maps to the OpenAI-compatible vLLM API.
services:
  gemma-vllm:
    image: vllm/vllm-openai:cu129-nightly
    pull_policy: always
    container_name: gemma4_31b_qat_w4a16_spark_vllm
    environment:
      - HF_HOME=/root/.cache/huggingface
      - HUGGINGFACE_HUB_CACHE=/root/.cache/huggingface/hub
      - VLLM_CACHE_ROOT=/root/.cache/vllm
      - PYTORCH_ALLOC_CONF=expandable_segments:True
      - HF_HUB_DISABLE_XET=1
    volumes:
      - ./tokens.env:/run/secrets/tokens.env:ro
      - vllm-hf-cache:/root/.cache/huggingface
      - vllm-runtime-cache:/root/.cache/vllm
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/v1/models"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 30m
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    entrypoint:
      - /bin/bash
      - -lc
    command:
      - |
        set -a
        . /run/secrets/tokens.env
        set +a
        if [ -n "$${HUGGINGFACE:-}" ]; then
          export HF_TOKEN="$${HUGGINGFACE}"
          export HUGGING_FACE_HUB_TOKEN="$${HUGGINGFACE}"
        fi
        python3 - <<'PY'
        import json
        from pathlib import Path

        snapshot_root = Path("/root/.cache/huggingface/hub/models--google--gemma-4-31B-it-qat-w4a16-ct/snapshots")
        for config_path in snapshot_root.glob("*/config.json"):
            config = json.loads(config_path.read_text())
            vision_config = config.get("vision_config")
            if isinstance(vision_config, dict) and "num_soft_tokens" not in vision_config:
                num_soft_tokens = vision_config.get("mm_posemb_size")
                if num_soft_tokens is not None:
                    vision_config["num_soft_tokens"] = num_soft_tokens
                    config_path.write_text(json.dumps(config, indent=2) + "\n")
                    print(f"Patched {config_path}: vision_config.num_soft_tokens={num_soft_tokens}")
        PY
        exec vllm serve google/gemma-4-31B-it-qat-w4a16-ct \
          --served-model-name active-model \
          --host 0.0.0.0 \
          --port 8000 \
          --dtype bfloat16 \
          --max-model-len 32768 \
          --gpu-memory-utilization 0.90 \
          --kv-cache-dtype fp8 \
          --max-num-seqs 2 \
          --max-num-batched-tokens 4096 \
          --enable-prefix-caching \
          --enable-chunked-prefill \
          --trust-remote-code \
          --limit-mm-per-prompt '{"image": 0, "audio": 0}' \
          --generation-config vllm \
          --reasoning-parser gemma4 \
          --enable-auto-tool-choice \
          --tool-call-parser gemma4 \
          --chat-template examples/tool_chat_template_gemma4.jinja \
          --default-chat-template-kwargs '{"enable_thinking": true}'

volumes:
  vllm-hf-cache:
  vllm-runtime-cache:
