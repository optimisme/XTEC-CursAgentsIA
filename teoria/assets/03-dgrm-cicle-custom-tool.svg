<svg xmlns="http://www.w3.org/2000/svg" width="980" height="360" viewBox="0 0 980 360" role="img" aria-labelledby="title desc">
  <title id="title">Cicle d'una custom tool</title>
  <desc id="desc">Flux entre descripció i arguments de la tool, decisió del model, execució amb args i context, i resultat retornat al model.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      .title { font: 700 26px Arial, Helvetica, sans-serif; fill: #0f172a; }
      .label { font: 700 17px Arial, Helvetica, sans-serif; fill: #0f172a; }
      .small { font: 12px Arial, Helvetica, sans-serif; fill: #475569; }
    </style>
  </defs>
  <rect width="980" height="360" fill="#f8fafc"/>
  <text x="490" y="44" text-anchor="middle" class="title">Cicle d'una custom tool</text>
  <text x="490" y="72" text-anchor="middle" class="small">Una tool és una acció estructurada dins del bucle agentic, no només una funció JavaScript.</text>

  <rect x="54" y="128" width="156" height="104" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="132" y="160" text-anchor="middle" class="label">Tool schema</text>
  <text x="132" y="184" text-anchor="middle" class="small">description</text>
  <text x="132" y="204" text-anchor="middle" class="small">+ args</text>

  <rect x="278" y="118" width="140" height="124" rx="14" fill="#e0f2fe" stroke="#38bdf8"/>
  <text x="348" y="156" text-anchor="middle" class="label">Model</text>
  <text x="348" y="180" text-anchor="middle" class="small">decideix si</text>
  <text x="348" y="200" text-anchor="middle" class="small">cal cridar-la</text>

  <rect x="486" y="118" width="164" height="124" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="568" y="154" text-anchor="middle" class="label">execute()</text>
  <text x="568" y="178" text-anchor="middle" class="small">args</text>
  <text x="568" y="198" text-anchor="middle" class="small">+ context</text>

  <rect x="718" y="128" width="168" height="104" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="802" y="162" text-anchor="middle" class="label">Resultat</text>
  <text x="802" y="186" text-anchor="middle" class="small">torna al model</text>
  <text x="802" y="206" text-anchor="middle" class="small">com observació</text>

  <g stroke="#334155" stroke-width="3" marker-end="url(#arrow)">
    <line x1="210" y1="180" x2="278" y2="180"/>
    <line x1="418" y1="180" x2="486" y2="180"/>
    <line x1="650" y1="180" x2="718" y2="180"/>
    <path d="M 790 232 C 690 302 295 302 190 234" fill="none"/>
  </g>
</svg>
