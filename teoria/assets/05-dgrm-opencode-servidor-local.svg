<svg xmlns="http://www.w3.org/2000/svg" width="980" height="360" viewBox="0 0 980 360" role="img" aria-labelledby="title desc">
  <title id="title">OpenCode amb servidor local</title>
  <desc id="desc">Flux d'OpenCode cap a opencode.json, provider OpenAI-compatible, servidor local, model local i GPU o CPU.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      .title { font: 700 26px Arial, Helvetica, sans-serif; fill: #0f172a; }
      .label { font: 700 16px Arial, Helvetica, sans-serif; fill: #0f172a; }
      .small { font: 12px Arial, Helvetica, sans-serif; fill: #475569; }
    </style>
  </defs>
  <rect width="980" height="360" fill="#f8fafc"/>
  <text x="490" y="44" text-anchor="middle" class="title">OpenCode amb servidor local</text>
  <text x="490" y="72" text-anchor="middle" class="small">OpenCode només necessita una API compatible, un model i una configuració.</text>

  <g stroke="#334155" stroke-width="3" marker-end="url(#arrow)">
    <line x1="160" y1="180" x2="218" y2="180"/>
    <line x1="350" y1="180" x2="408" y2="180"/>
    <line x1="548" y1="180" x2="606" y2="180"/>
    <line x1="750" y1="180" x2="808" y2="180"/>
  </g>

  <g>
    <rect x="42" y="132" width="118" height="96" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="101" y="170" text-anchor="middle" class="label">OpenCode</text>
    <text x="101" y="194" text-anchor="middle" class="small">agent</text>
  </g>
  <g>
    <rect x="218" y="122" width="132" height="116" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="284" y="160" text-anchor="middle" class="label">opencode.json</text>
    <text x="284" y="184" text-anchor="middle" class="small">model</text>
    <text x="284" y="204" text-anchor="middle" class="small">provider</text>
  </g>
  <g>
    <rect x="408" y="122" width="140" height="116" rx="14" fill="#e0f2fe" stroke="#38bdf8"/>
    <text x="478" y="154" text-anchor="middle" class="label">Provider</text>
    <text x="478" y="178" text-anchor="middle" class="small">OpenAI-compatible</text>
    <text x="478" y="202" text-anchor="middle" class="small">/v1/chat/completions</text>
  </g>
  <g>
    <rect x="606" y="112" width="144" height="136" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="678" y="148" text-anchor="middle" class="label">Servidor local</text>
    <text x="678" y="174" text-anchor="middle" class="small">vLLM</text>
    <text x="678" y="194" text-anchor="middle" class="small">Ollama</text>
    <text x="678" y="214" text-anchor="middle" class="small">llama.cpp</text>
  </g>
  <g>
    <rect x="808" y="122" width="130" height="116" rx="14" fill="#ecfdf5" stroke="#86efac"/>
    <text x="873" y="160" text-anchor="middle" class="label">Model local</text>
    <text x="873" y="184" text-anchor="middle" class="small">pesos descarregats</text>
    <text x="873" y="204" text-anchor="middle" class="small">GPU / CPU</text>
  </g>
</svg>
