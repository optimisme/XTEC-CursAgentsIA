<rect x="60" y="112" width="220" height="40" rx="8" class="box"/><text x="170" y="137" text-anchor="middle" class="t">RAM</text><rect x="400" y="112" width="220" height="40" rx="8" class="box"/><text x="510" y="137" text-anchor="middle" class="t">Finestra de context</text><line x1="280" y1="132" x2="400" y2="132" class="dash"/>
