<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" width="680" height="420"><style>text{font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif;fill:#1f2937}.t{font-size:15px;font-weight:600}.s{font-size:12px;fill:#4b5563}.h{font-size:17px;font-weight:700}.box{fill:#f8fafc;stroke:#64748b;stroke-width:1.5}.blue{fill:#e0ecff;stroke:#3b6fd8;stroke-width:1.5}.green{fill:#e3f5e8;stroke:#2f9e57;stroke-width:1.5}.amber{fill:#fff4dc;stroke:#d89a1f;stroke-width:1.5}.rose{fill:#fde8ea;stroke:#d0455a;stroke-width:1.5}.ln{stroke:#7c8594;stroke-width:2;fill:none;marker-end:url(#a)}.dash{stroke:#7c8594;stroke-width:1.3;stroke-dasharray:5 4;fill:none}.mk{fill:#7c8594}.badge{fill:#f8fafc;fill-opacity:.8}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" class="mk"/></marker></defs>
<rect x="122.4" y="17.2" width="95.2" height="26" class="badge"/><text x="170" y="34" text-anchor="middle" class="h">Ordinador</text><rect x="457.7" y="17.2" width="104.7" height="26" class="badge"/><text x="510" y="34" text-anchor="middle" class="h">Agent LLM</text>
