<path d="M222 230 L266 130" class="ln"/><rect x="153" y="158" width="88" height="19" class="badge"/><text x="234" y="172" text-anchor="end" class="s lbl">torna a pensar</text>
<path d="M410 100 L485 100" class="ln"/><rect x="409" y="60" width="77" height="19" class="badge"/><text x="447.5" y="74" text-anchor="middle" class="s lbl">ja en té prou</text>
