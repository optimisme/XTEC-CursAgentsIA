<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320"><style>text{font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif;fill:#1f2937}.t{font-size:15px;font-weight:600}.s{font-size:12px;fill:#4b5563}.h{font-size:17px;font-weight:700}.box{fill:#f8fafc;stroke:#64748b;stroke-width:1.5}.blue{fill:#e0ecff;stroke:#3b6fd8;stroke-width:1.5}.green{fill:#e3f5e8;stroke:#2f9e57;stroke-width:1.5}.amber{fill:#fff4dc;stroke:#d89a1f;stroke-width:1.5}.rose{fill:#fde8ea;stroke:#d0455a;stroke-width:1.5}.ln{stroke:#7c8594;stroke-width:2;fill:none;marker-end:url(#a)}.dash{stroke:#94a3b8;stroke-width:1.3;stroke-dasharray:5 4;fill:none}.mk{fill:#7c8594}.lbl{fill:#374151}.title{fill:#1f2937}.badge{fill:#f8fafc;fill-opacity:.8}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" class="mk"/></marker></defs>
<rect x="218" y="10" width="204" height="30" class="badge"/><text x="320" y="31" text-anchor="middle" class="h title">Bucle ReAct d'un agent</text>
<rect x="30" y="72" width="120" height="56" rx="28" class="box"/><text x="90" y="96" text-anchor="middle" class="t">Prompt</text><text x="90" y="114" text-anchor="middle" class="s">de l'usuari</text>
<path d="M320 50 L410 100 L320 150 L230 100 Z" class="blue"/><text x="320" y="97" text-anchor="middle" class="t">Pensar</text><text x="320" y="115" text-anchor="middle" class="s">decideix l'acció</text>
<rect x="350" y="230" width="140" height="56" rx="10" class="amber"/><text x="420" y="254" text-anchor="middle" class="t">Actuar</text><text x="420" y="272" text-anchor="middle" class="s">executa una eina</text>
<rect x="150" y="230" width="140" height="56" rx="10" class="green"/><text x="220" y="254" text-anchor="middle" class="t">Observar</text><text x="220" y="272" text-anchor="middle" class="s">llegeix el resultat</text>
<rect x="490" y="72" width="130" height="56" rx="28" class="rose"/><text x="555" y="96" text-anchor="middle" class="t">Acabar</text><text x="555" y="114" text-anchor="middle" class="s">dona la resposta</text>
<path d="M150 100 L226 100" class="ln"/>
<path d="M372 126 L418 226" class="ln"/><rect x="397" y="158" width="75" height="19" class="badge"/><text x="404" y="172" class="s lbl">cal una eina</text>
