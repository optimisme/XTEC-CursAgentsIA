<svg xmlns="http://www.w3.org/2000/svg" width="980" height="620" viewBox="0 0 980 620" role="img" aria-labelledby="title desc">
  <title id="title">Arquitectures habituals d'agents</title>
  <desc id="desc">Comparació visual entre agent simple, planner-executor, agent amb subagents, agent amb RAG i agent revisor.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      .title { font: 700 26px Arial, Helvetica, sans-serif; fill: #0f172a; }
      .label { font: 700 16px Arial, Helvetica, sans-serif; fill: #0f172a; }
      .small { font: 12px Arial, Helvetica, sans-serif; fill: #475569; }
      .box { fill: #ffffff; stroke: #cbd5e1; }
      .accent { fill: #ecfeff; stroke: #22d3ee; }
    </style>
  </defs>
  <rect width="980" height="620" fill="#f8fafc"/>
  <text x="490" y="44" text-anchor="middle" class="title">Arquitectures habituals d'agents</text>
  <text x="490" y="72" text-anchor="middle" class="small">Cada arquitectura reparteix de manera diferent planificació, eines, context i revisió.</text>

  <g transform="translate(40,105)">
    <rect width="270" height="190" rx="14" class="box"/>
    <text x="135" y="32" text-anchor="middle" class="label">Agent simple</text>
    <rect x="82" y="58" width="106" height="38" rx="9" class="accent"/>
    <text x="135" y="82" text-anchor="middle" class="small">Model</text>
    <rect x="82" y="128" width="106" height="38" rx="9" class="box"/>
    <text x="135" y="152" text-anchor="middle" class="small">Eina</text>
    <path d="M135 96 L135 125" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
    <path d="M105 128 C55 112 55 78 82 76" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <text x="135" y="180" text-anchor="middle" class="small">decideix, actua i observa</text>
  </g>

  <g transform="translate(355,105)">
    <rect width="270" height="190" rx="14" class="box"/>
    <text x="135" y="32" text-anchor="middle" class="label">Planner-executor</text>
    <rect x="35" y="62" width="88" height="38" rx="9" class="accent"/>
    <text x="79" y="86" text-anchor="middle" class="small">Planner</text>
    <rect x="148" y="62" width="88" height="38" rx="9" class="box"/>
    <text x="192" y="86" text-anchor="middle" class="small">Executor</text>
    <rect x="91" y="128" width="88" height="38" rx="9" class="box"/>
    <text x="135" y="152" text-anchor="middle" class="small">Resultats</text>
    <path d="M123 81 L145 81" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
    <path d="M192 100 L151 126" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
    <path d="M91 147 C42 137 38 102 65 95" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <text x="135" y="180" text-anchor="middle" class="small">separa pla i execució</text>
  </g>

  <g transform="translate(670,105)">
    <rect width="270" height="190" rx="14" class="box"/>
    <text x="135" y="32" text-anchor="middle" class="label">Subagents</text>
    <rect x="78" y="52" width="114" height="34" rx="9" class="accent"/>
    <text x="135" y="74" text-anchor="middle" class="small">Agent principal</text>
    <rect x="24" y="125" width="68" height="34" rx="9" class="box"/>
    <text x="58" y="146" text-anchor="middle" class="small">Explore</text>
    <rect x="101" y="125" width="68" height="34" rx="9" class="box"/>
    <text x="135" y="146" text-anchor="middle" class="small">Review</text>
    <rect x="178" y="125" width="68" height="34" rx="9" class="box"/>
    <text x="212" y="146" text-anchor="middle" class="small">Test</text>
    <path d="M113 86 L68 122" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow)"/>
    <path d="M135 86 L135 122" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow)"/>
    <path d="M157 86 L202 122" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow)"/>
    <text x="135" y="180" text-anchor="middle" class="small">delegació especialitzada</text>
  </g>

  <g transform="translate(190,350)">
    <rect width="270" height="190" rx="14" class="box"/>
    <text x="135" y="32" text-anchor="middle" class="label">Agent amb RAG</text>
    <rect x="35" y="66" width="82" height="38" rx="9" class="accent"/>
    <text x="76" y="90" text-anchor="middle" class="small">Model</text>
    <rect x="154" y="66" width="82" height="38" rx="9" class="box"/>
    <text x="195" y="90" text-anchor="middle" class="small">Cerca</text>
    <rect x="94" y="130" width="82" height="38" rx="9" class="box"/>
    <text x="135" y="154" text-anchor="middle" class="small">Docs</text>
    <path d="M117 85 L151 85" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
    <path d="M195 104 L153 128" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
    <path d="M94 149 C42 133 44 94 35 88" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <text x="135" y="180" text-anchor="middle" class="small">recupera context documental</text>
  </g>

  <g transform="translate(520,350)">
    <rect width="270" height="190" rx="14" class="box"/>
    <text x="135" y="32" text-anchor="middle" class="label">Agent revisor</text>
    <rect x="35" y="66" width="86" height="38" rx="9" class="accent"/>
    <text x="78" y="90" text-anchor="middle" class="small">Executor</text>
    <rect x="151" y="66" width="86" height="38" rx="9" class="box"/>
    <text x="194" y="90" text-anchor="middle" class="small">Revisor</text>
    <rect x="91" y="130" width="88" height="38" rx="9" class="box"/>
    <text x="135" y="154" text-anchor="middle" class="small">Canvi</text>
    <path d="M121 85 L148 85" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
    <path d="M194 104 L154 128" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
    <path d="M91 149 C42 133 42 95 64 94" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <text x="135" y="180" text-anchor="middle" class="small">implementa i després critica</text>
  </g>
</svg>
