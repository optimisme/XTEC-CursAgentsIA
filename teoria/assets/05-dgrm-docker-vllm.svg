<svg xmlns="http://www.w3.org/2000/svg" width="980" height="430" viewBox="0 0 980 430" role="img" aria-labelledby="title desc">
  <title id="title">Docker vLLM</title>
  <desc id="desc">Flux de docker-compose cap al container vLLM, endpoints OpenAI-compatible, GPU i cache de Hugging Face.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      .title { font: 700 26px Arial, Helvetica, sans-serif; fill: #0f172a; }
      .label { font: 700 17px Arial, Helvetica, sans-serif; fill: #0f172a; }
      .small { font: 12px Arial, Helvetica, sans-serif; fill: #475569; }
      .mono { font: 12px Menlo, Consolas, monospace; fill: #334155; }
    </style>
  </defs>
  <rect width="980" height="430" fill="#f8fafc"/>
  <text x="490" y="44" text-anchor="middle" class="title">vLLM amb Docker</text>
  <text x="490" y="72" text-anchor="middle" class="small">Docker Compose encapsula el servidor, els ports, la GPU i les caches necessàries.</text>

  <rect x="302" y="94" width="180" height="58" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="392" y="118" text-anchor="middle" class="label">GPU / CPU</text>
  <text x="392" y="139" text-anchor="middle" class="small">memòria i inferència</text>

  <rect x="50" y="178" width="160" height="104" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="130" y="216" text-anchor="middle" class="label">docker-compose</text>
  <text x="130" y="240" text-anchor="middle" class="small">imatge, ports</text>
  <text x="130" y="260" text-anchor="middle" class="small">volums, command</text>

  <rect x="285" y="170" width="215" height="120" rx="16" fill="#e0f2fe" stroke="#38bdf8"/>
  <text x="392" y="207" text-anchor="middle" class="label">Container vLLM</text>
  <text x="392" y="231" text-anchor="middle" class="small">serveix el model</text>
  <text x="392" y="253" text-anchor="middle" class="mono">vllm serve ...</text>
  <text x="392" y="275" text-anchor="middle" class="small">API OpenAI-compatible</text>

  <rect x="575" y="162" width="175" height="136" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="662" y="200" text-anchor="middle" class="label">Endpoints</text>
  <text x="662" y="226" text-anchor="middle" class="mono">/v1/models</text>
  <text x="662" y="250" text-anchor="middle" class="mono">/v1/chat/completions</text>

  <rect x="790" y="178" width="140" height="104" rx="14" fill="#ecfdf5" stroke="#86efac"/>
  <text x="860" y="216" text-anchor="middle" class="label">Client</text>
  <text x="860" y="240" text-anchor="middle" class="small">OpenCode</text>
  <text x="860" y="260" text-anchor="middle" class="small">o aplicació</text>

  <rect x="302" y="333" width="180" height="58" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="392" y="357" text-anchor="middle" class="label">Cache HF</text>
  <text x="392" y="378" text-anchor="middle" class="small">models i tokens</text>

  <g stroke="#334155" stroke-width="3" marker-end="url(#arrow)">
    <line x1="210" y1="230" x2="285" y2="230"/>
    <line x1="500" y1="230" x2="575" y2="230"/>
    <line x1="750" y1="230" x2="790" y2="230"/>
    <path d="M 392 170 L 392 155" fill="none"/>
    <path d="M 392 290 L 392 330" fill="none"/>
  </g>
</svg>
